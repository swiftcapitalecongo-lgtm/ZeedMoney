<body>
  <div id="app"></div>
  <div id="admin-auth" style="position:fixed;inset:0;z-index:200;background:#f4f7f9;display:grid;place-items:center;padding:20px">
    <form id="admin-login" style="width:min(390px,100%);background:#fff;border:1px solid #dfe7eb;border-radius:12px;padding:28px;box-shadow:0 20px 55px rgba(5,29,46,.14)">
      <div style="display:flex;align-items:center;gap:10px;color:#091f32;margin-bottom:25px"><strong style="font-size:19px">ZedMoney</strong><span style="color:#697a86;font-size:12px">Admin console</span></div>
      <h1 style="font-size:23px;margin:0 0 6px;color:#122330">Administrator sign in</h1><p style="font-size:12px;color:#697a86;margin:0 0 20px">Use your administrator password to continue.</p>
      <label for="admin-password" style="display:block;font-size:11px;font-weight:700;color:#405762;margin-bottom:7px">Admin password</label><input id="admin-password" type="password" autocomplete="current-password" required style="width:100%;height:40px;border:1px solid #cfdbe1;border-radius:7px;padding:0 10px">
      <p id="admin-error" style="min-height:18px;color:#b94d4d;font-size:11px;margin:10px 0"></p><button id="admin-submit" type="submit" style="width:100%;height:40px;background:#0d3653;color:#fff;border-radius:7px;font-weight:700">Sign in</button>
    </form>

    let users=names.map((name,i)=>({id:`ZM-${String(100000+i).padStart(6,'0')}`,name,displayId:`ZM-${String(100000+i).padStart(6,'0')}`,phone:`+260 ${['97','96','95','77'][i%4]} ${String(100000+i*137).slice(0,3)} ${String(1842+i*83).slice(-4)}`,email:`${name.toLowerCase().replace(/ /g,'.')}@example.test`,wallet:`ZM-WALLET-${String(1900+i).padStart(4,'0')}`,balance:12845.5+(i*1837.25),status:i===4?'Suspended':i===9?'Restricted':i%11===0?'Pending verification':'Active',verification:i%7===0?'Pending':i%9===0?'Unverified':'Verified',last:i%3===0?'Just now':`${i+1} hours ago`,created:`${String((i%27)+1).padStart(2,'0')} Aug 2026`}));

     function shell(content){return `<div class="shell"><aside class="sidebar">${brand()}${nav()}<div class="admin-profile"><span class="avatar admin">SA</span><div><strong>Administrator</strong><span>System Admin</span></div><button onclick="zedmoneyAdmin.logout()" aria-label="Sign out">${I.arrow}</button></div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="icon menu-btn" onclick="toggleDrawer(true)" aria-label="Open menu">${I.menu}</button>${state.view!=='overview'?`<button class="icon" onclick="goBack()" aria-label="Back">${I.back}</button>`:''}<div><div class="page-kicker">ZedMoney operations</div><h2 class="page-title">${pageTitle()}</h2></div></div><div class="top-actions"><div class="global-search">${I.search}<input placeholder="Search ZedMoney  ( / )" value="${state.query}" oninput="globalSearch(this.value)" onclick="openSearch()"></div><button class="icon relative" onclick="navigate('notifications')" aria-label="Notifications">${I.bell}<i class="notification-dot"></i></button><button class="system-status" onclick="navigate('provider')"><i></i> Systems operational</button><span class="avatar admin">SA</span></div></header><div class="content">${content}</div></main><nav class="bottom">${[['overview','Home','grid'],['users','Users','users'],['transactions','Txns','clock'],['risk','Risk','alert'],['menu','Menu','menu']].map(n=>`<button class="${state.view===n[0]?'active':''}" onclick="${n[0]==='menu'?'toggleDrawer(true)':`navigate('${n[0]}')`}">${I[n[2]]}<span>${n[1]}</span></button>`).join('')}</nav></div>${drawer()}${modal()}</div>`}

    function badge(s){const c={'Successful':'success','Active':'active','Completed':'success','Operational':'success','Verified':'success','Pending':'pending','Processing':'processing','Suspended':'suspended','Frozen':'frozen','Restricted':'restricted','Failed':'failed','High Risk':'high','Critical':'critical','Medium':'medium'}[s]||'neutral';return `<span class="badge ${c}">${s}</span>`}

iv><div class="wide-grid spacer"><div class="card pad"><div class="card-title"><div><h2>Requires attention</h2><p>Items from financial operations and risk</p></div><button class="text-btn" onclick="navigate('risk')">View risk</button></div>${[['Reconciliation mismatch','Provider balance differs by K 550','warning'],['Withdrawal review','12 withdrawals are waiting for review','warning'],['Failed webhooks','3 provider events need retry','danger']].map(x=>`<div class="alert-row">${I.alert}<div><strong>${x[0]}</strong><span>${x[1]}</span></div>${badge(x[2]==='danger'?'Critical':'Pending')}</div>`).join('')}</div><div class="card pad"><div class="card-title"><div><h2>System health</h2><p>Service status at a glance</p></div><button class="text-btn" onclick="navigate('health')">Details</button></div>${[['API','42 ms'],['Database','18 ms'],['Lipila','124 ms']].map(x=>`<div class="detail-row"><span>${x[0]}</span><strong style="color:var(--green)">${x[1]} · Operational</strong></div>`).join('')}</div></div></section>`}
    function chart(){return `<div class="chart"><svg viewBox="0 0 800 225" preserveAspectRatio="none"><path d="M0 176 C45 152 70 168 108 149 S175 130 215 151 S260 107 312 125 S372 83 420 114 S486 100 520 112 S580 60 625 91 S688 55 735 72 S770 47 800 54" fill="none" stroke="#166083" stroke-width="3"/><path d="M0 195 C52 185 71 194 108 180 S169 171 215 181 S272 159 312 168 S367 142 420 154 S475 145 520 153 S580 125 625 141 S687 116 735 130 S770 104 800 118" fill="none" stroke="#79c4c7" stroke-width="2"/><path d="M0 176 C45 152 70 168 108 149 S175 130 215 151 S260 107 312 125 S372 83 420 114 S486 100 520 112 S580 60 625 91 S688 55 735 72 S770 47 800 54 L800 225 L0 225Z" fill="#166083" opacity=".07"/></svg></div><div class="chart-labels"><span>01 Aug</span><span>08 Aug</span><span>15 Aug</span><span>22 Aug</span><span>Today</span></div>`}
    function usersPage(){let list=users.filter(u=>{const q=state.query.toLowerCase();return(!q||[u.name,u.id,u.phone,u.email].join(' ').toLowerCase().includes(q))&&(state.userFilter==='All'||u.status===state.userFilter)});return `<section class="view">${heading('Users','Manage wallet customers, account status and operational actions.',`<button class="primary" onclick="showToast('User creation is a backend workflow')">${I.plus} Add user</button>`)}<div class="card table-card">${tableToolbar('Search name, ID, phone or email',`<select class="filter" onchange="state.userFilter=this.value;state.page=1;render()"><option>All</option><option>Active</option><option>Suspended</option><option>Restricted</option><option>Pending verification</option></select>`)}<div class="table-wrap"><table><thead><tr><th>User</th><th>Phone</th><th>Wallet</th><th>Balance</th><th>Status</th><th>Verification</th><th>Last active</th><th>Created</th><th>Actions</th></tr></thead><tbody>${list.slice((state.page-1)*8,state.page*8).map(u=>`<tr onclick="openUser('${u.id}')"><td>${person(u)}</td><td>${u.phone}</td><td>${u.wallet}</td><td style="font-weight:700">${money(u.balance)}</td><td>${badge(u.status)}</td><td>${badge(u.verification)}</td><td>${u.last}</td><td>${u.created}</td><td><div class="row-actions" onclick="event.stopPropagation()"><button onclick="openUser('${u.id}')">${I.arrow}</button><button onclick="openAction('${u.id}','Suspend user')">${I.lock}</button></div></td></tr>`).join('')}</tbody></table></div>${pagination(list.length)}</div></section>`}

    function genericTable(view){const configs={ 'payment-links':['Payment links','Manage payment requests and collection performance',['Link','Owner','Amount','Payments','Collected','Status','Created','Expiry']],merchants:['Merchants','Manage business accounts and settlement status',['Merchant','Merchant ID','Owner','Status','Total sales','Settlement','Risk status']],ledger:['Ledger','Immutable financial records for wallet movement.',['Entry ID','Wallet','Transaction','Direction','Amount','Balance before','Balance after','Entry type']],reconciliation:['Reconciliation','Compare provider records with internal financial records.',['Issue','Provider','Internal','Difference','Status','Action']],webhooks:['Webhooks','Monitor provider events and retry processing when needed.',['Event ID','Provider','Event type','Transaction ID','Received','Processed','Status']],audit:['Audit logs','Administrative actions are recorded and cannot be edited.',['Timestamp','Admin','Action','Target','Reason','Reference']],cases:['Support cases','Operational cases and requests from wallet users.',['Case ID','User','Subject','Priority','Status','Assigned admin']]};const c=configs[view]||[pageTitle(),'Operational records for this section.',['ID','Name','Status','Updated','Actions']];let rows='';if(view==='payment-links')rows=links.map(x=>`<tr><td>${x.id} · ${x.name}</td><td>${x.owner.name}</td><td>${money(x.amount)}</td><td>${x.payments}</td><td>${money(x.amount*x.payments*.8)}</td><td>${badge(x.status)}</td><td>${x.created}</td><td>${x.expiry}</td></tr>`).join('');else if(view==='merchants')rows=users.slice(0,8).map((u,i)=>`<tr><td><b>${['Manda Hill Market','Kwacha Eats','Lusaka Design Co','Copperbelt Supplies','Kabulonga Pharmacy','Mosi Events','ZedShop','Northmead Cafe'][i]}</b></td><td>MER-${100+i}</td><td>${u.name}</td><td>${badge(i===3?'Pending':'Active')}</td><td>${money(45000+i*7310)}</td><td>${badge('Active')}</td><td>${badge(i===5?'High Risk':'Low')}</td></tr>`).join('');else if(view===' d ledger events rather than overwrite a balance.</span></div>`:''}<div class="card table-card spacer">${tableToolbar('Search '+c[0].toLowerCase())}<div class="table-wrap"><table><thead><tr>${c[2].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>${pagination(Math.max(12,rows.split('<tr>').length-1))}</div></section>`}
    function adjustments(){return `<section class="view">${heading('Balance adjustments','Every credit, debit, reserve and release is an audited financial operation.')}<div class="wide-grid"><div class="card pad"><div class="card-title"><div><h2>Create adjustment</h2><p>Never overwrite a wallet balance directly.</p></div></div><div class="notice">${I.database}<span>This creates an immutable ledger entry, adjustment transaction and audit record.</span></div><div class="form-grid spacer"><div class="field"><label>Adjustment type</label><select id="adjust-type"><option>Credit</option><option>Debit</option><option>Reserve funds</option><option>Release reserved funds</option></select></div><div class="field"><label>Amount</label><input id="adjust-amount" value="500.00"></div><div class="field"><label>Reason</label><select><option>Manual correction</option><option>Refund</option><option>Reversal</option><option>Dispute resolution</option><option>Provider reconciliation</option><option>Promotional credit</option><option>Fee correction</option></select></div><div class="field"><label>Reference <b style="color:var(--red)">*</b></label><input value="ADJ-83921"></div><div class="field full"><label>Internal note <b style="color:var(--red)">*</b></label><textarea>Customer contacted support regarding balance correction.</textarea></div></div><div class="form-actions"><button class="primary" onclick="showConfirm('Confirm adjustment?','Current balance K 12,845.50 · Adjustment K 500.00 · Resulting balance K 13,345.50','Confirm adjustment','applyAdjustment()')">${I.check} Confirm adjustment</button></div></div><div class="card pad"><div class="card-title"><div><h2>Recent adjustments</h2><p>Immutable operation history</p></div></div>${[['Credit adjustment','K 500.00','ADJ-83921','Completed'],['Reserve funds','K 2,000.00','RSV-19022','Completed'],['Debit adjustment','K 120.00','ADJ-83910','Completed'],['Release reserved funds','K 800.00','REL-19007','Completed']].map(x=>`<div class="de     function userModal(u){return `<div class="modal-head"><h2>${u.name}</h2><button class="icon" onclick="closeModal()">${I.close}</button></div><div class="modal-body"><div class="person" style="margin-bottom:18px">${person(u)}<span style="margin-left:auto">${badge(u.status)}</span></div><div class="detail-grid"><div class="detail-cell"><label>User ID</label><strong>${u.id}</strong></div><div class="detail-cell"><label>Phone</label><strong>${u.phone}</strong></div><div class="detail-cell"><label>Wallet</label><strong>${u.wallet}</strong></div><div class="detail-cell"><label>Available balance</label><strong>${money(u.balance)}</strong></div><div class="detail-cell"><label>Verification</label><strong>${u.verification}</strong></div><div class="detail-cell"><label>Last activity</label><strong>${u.last}</strong></div></div><div class="wide-grid spacer"><div><h3>Account information</h3><div class="detail-list"><div class="detail-row"><span>Email</span><strong>${u.email}</strong></div><div class="detail-row"><span>Country</span><strong>Zambia</strong></div><div class="detail-row"><span>Currency</span><strong>ZMW</strong></div><div class="detail-row"><span>Created</span><strong>${u.created}</strong></div></div></div><div><h3>Risk & security</h3><div class="detail-list"><div class="detail-row"><span>Risk level</span><strong>${badge(u.status==='Restricted'?'High Risk':'Low')}</strong></div><div class="detail-row"><span>Failed transactions</span><strong>${u.id.slice(-1)*1+2}</strong></div><div class="detail-row"><span>Active sessions</span><strong>${(u.id.slice(-1)*1)%3+1}</strong></div><div class="detail-row"><span>Security events</span><strong>2</strong></div></div></div></div><div class="notice spacer">${I.note}<span>Activity, restrictions and audit history and authorization are enforced by the backend when connected.</span></div><div class="modal-actions"><button class="secondary" onclick="openAction('${u.id}','Restrict user')">Restrict</button><button class="danger" onclick="openAction('${u.id}','Suspend user')">${I.lock} Suspend user</button><button class="primary" onclick="showToast('Wallet view opened')">View wallet ${I.arrow}</button></div></div>`}
    function txModal(t){return `<div class="modal-head"><h2>Transaction details</h2><button class="icon" onclick="closeModal()">${I.close}</button></div><div class="modal-body"><div class="detail-grid"><div class="detail-cell"><label>Transaction ID</label><strong>${t.id}</strong></div><div class="detail-cell"><label>Provider ID</label><strong>${t.providerRef}</strong></div><div class="detail-cell"><label>Status</label><strong>${t.status}</strong></div><div class="detail-cell"><label>User</label><strong>${t.user.name}</strong></div><div class="detail-cell"><label>Amount</label><strong>${money(Math.abs(t.amount))}</strong></div><div class="detail-cell"><label>Fee</label><strong>${money(t.fee)}</strong></div></div><div class="detail-list spacer"><div class="detail-row"><span>Wallet</span><strong>${t.user.wallet}</strong></div><div class="detail-row"><span>Net amount</span><strong>${money(Math.abs(t.amount)-t.fee)}</strong></div><div class="detail-row"><span>Currency</span><strong>ZMW</strong></div><div class="detail-row"><span>Provider</span><strong>${t.provider}</strong></div><div class="detail-row"><span>Payment method</span><strong>${t.method}</strong></div><div class="detail-row"><span>Created</span><strong>${t.date}</strong></div><div class="detail-row"><span>Description</span><strong>${t.type} for ${t.user.name}</strong></div></div><div class="timeline"><span class="timeline-step done"><i></i>Created</span><span class="timeline-step done"><i></i>Provider request</span><span class="timeline-step done"><i></i>Provider processing</span><span class="timeline-step done"><i></i>Webhook received</span><span class="timeline-step done"><i></i>Verification</span><span class="timeline-step ${t.status==='Successful'?'done':''}"><i></i>${t.status}</span></div><div class="modal-actions"><button class="secondary" onclick="showToast('Transaction export started')">${I.download} Export</button><button class="warning" onclick="openAction('${t.id}','Refund transaction')">Refund</button><button class="danger" onclick="openAction('${t.id}','Reverse transaction')">Reverse</button></div></div>`}
    function actionModal(a){const isSuspend=a.label.includes('Suspend'),isFreeze=a.label.includes('Freeze'),isRestrict=a.label.includes('Restrict');return `<div class="modal-head"><h2>${a.label}</h2><button class="icon" onclick="closeModal()">${I.close}</button></div><div class="modal-body">${isSuspend||isFreeze||isRestrict?`<div class="notice ${isSuspend||isFreeze?'warning':''}">${isFreeze?I.lock:I.alert}<span>This action requires the authenticated admin backend and will be audited before affecting an account or wallet.</span></div>`:''}<div class="form-grid"><div class="field full"><label>Reason</label><select id="action-reason"><option>Suspicious activity</option><option>Security concern</option><option>Failed verification</option><option>Policy violation</option><option>User request</option><option>Other</option></select></div><div class="field full"><label>Additional note</label><textarea id="action-note" placeholder="Add an internal operational note"></textarea></div>${isSuspend?`<div class="field"><label>Duration</label><select><option>Indefinite</option><option>Until date</option></select></div>`:''}${isRestrict?`<div class="field full"><label>Restrictions</label><select multiple style="height:84px"><option>Cannot send money</option><option>Cannot receive money</option><option>Cannot withdraw</option><option>Cannot deposit</option><option>Cannot create payment links</option></select></div>`:''}</div><div class="form-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="${isSuspend||isFreeze?'danger':'primary'}" onclick="confirmAction('${a.target}','${a.label}')">${a.label}</button></div></div>`}
    function adjustmentModal(){return `<div class="modal-head"><h2>Confirm financial adjustment</h2><button class="icon" onclick="closeModal()">${I.close}</button></div><div class="modal-body"><div class="notice warning">${I.alert}<span>This operation creates a new audited financial event. It does not directly overwrite the wallet balance.</span></div><div class="detail-list"><div class="detail-row"><span>Current balance</span><strong>K 12,845.50</strong></div><div class="detail-row"><span>Debit adjustment</span><strong style="color:var(--red)">− K 500.00</strong></div><div class="detail-row"><span>Resulting balance</span><strong>K 12,345.50</strong></div><div class="detail-row"><span>Reference</span><strong>ADJ-83921</strong></div></div><div class="form-field spacer"><label>Admin confirmation note</label><textarea placeholder="Confirm why this adjustment is being made"></textarea></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="applyAdjustment()">${I.check} Confirm adjustment</button></div></div>`}
    function modal(){if(!state.modal)return '';let body='';if(state.modal.type==='user')body=userModal(state.modal.data);if(state.modal.type==='tx')body=txModal(state.modal.data);if(state.modal.type==='action')body=actionModal(state.modal);if(state.modal.type==='adjustment')body=adjustmentModal();return `<div class="modal-backdrop open" id="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`}
    function page(){switch(state.view){case'overview':return overview();case'users':return usersPage();case'wallets':return walletsPage();case'transactions':return transactionTable('Transactions','Review every money movement across the platform.');case'deposits':return depositsPage();case'withdrawals':return withdrawalsPage();case'transfers':return transfersPage();case'adjustments':return adjustments();case'risk':return risk();case'frozen':return frozenPage();case'suspended':return suspendedPage();case'provider':return provider();case'health':return health();case'notifications':return notificationsPage();case'sessions':return sessions();case'admin-profile':return adminProfile();case'permissions':return permissions();case'settings':return adminSettings();case'payment-links':case'merchants':case'ledger':case'reconciliation':case'webhooks':case'audit':case'cases':return genericTable(state.view);case'limits':return limitsPage();case'fees':return feesPage();case'security-events':return securityEventsPage();case'jobs':return jobsPage();case'notes':return notesPage();default:return overview()}}
    function limitsPage(){return `<section class="view">${heading('Limits','Configure platform and user-specific transaction limits.')}<div class="card pad"><div class="kpi-grid">${[['Daily deposit','K 25,000'],['Daily withdrawal','K 10,000'],['Daily transfer','K 10,000'],['Monthly volume','K 100,000']].map(x=>`<div class="kpi"><span>${x[0]}</span><strong>${x[1]}</strong><small>Configured limits are loaded from the backend when available</small></div>`).join('')}</div><div class="detail-list spacer">${[['Per-transaction maximum','K 10,000'],['Minimum transaction','K 1.00'],['User-specific overrides','3 configured']].map(x=>`<div class="detail-row"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="form-actions"><button class="primary" onclick="showToast('Limit configuration requires authenticated backend authorization')">Save changes</button></div></div></section>`}
    function feesPage(){return `<section class="view">${heading('Fees','Review fee configuration. Changes require backend authorization.')}<div class="wide-grid">${['Deposit fees','Withdrawal fees','Transfer fees','Payment-link fees','Merchant fees'].map((x,i)=>`<div class="card pad"><div class="card-title"><h2>${x}</h2></div><div class="form-grid"><div class="field"><label>Fixed</label><input value="K ${i?2:0}.00"></div><div class="field"><label>Percentage</label><input value="${i?0.5:0}%"></div><div class="field"><label>Minimum</label><input value="K 1.00"></div><div class="field"><label>Maximum</label><input value="K 50.00"></div></div><div class="form-actions"><button class="secondary" onclick="showToast('Fee changes require backend authorization')">Save changes</button></div></div>`).join('')}</div></section>`}
    function securityEventsPage(){return `<section class="view">${heading('Security events','Login, device, PIN and administrative security events.') }<div class="card table-card">${tableToolbar('Search user, event or device')}<div class="table-wrap"><table><thead><tr><th>Time</th><th>User</th><th>Event</th><th>Device / IP</th><th>Status</th></tr></thead><tbody>${securityEvents.map(x=>`<tr><td>${x.time}</td><td>${x.user.name}</td><td>${x.event}</td><td>${x.device} · 197.184.22.10</td><td>${badge(x.status)}</td></tr>`).join('')}</tbody></table></div></div></section>`}
    function jobsPage(){return `<section class="view">${heading('Background jobs','Monitor asynchronous operations. No job runner is configured yet.') }<div class="card pad">${[['Webhook processing','Running','2 minutes ago'],['Reconciliation','Completed','5 minutes ago'],['Notification delivery','Running','Just now'],['Transaction retry','Waiting','12 minutes ago'],['Withdrawal processing','Failed','18 minutes ago']].map(x=>`<div class="job-row"><div class="job-main">${I.clock}<div><strong>${x[0]}</strong><span>${x[2]}</span></div></div>${badge(x[1])}</div>`).join('')}</div></section>`}
    function notesPage(){return `<section class="view">${heading('Admin notes','Internal notes attached to users, transactions and risk cases.',`<button class="primary" onclick="showToast('Note creation requires the admin notes backend')">${I.plus} Add note</button>`)}<div class="card pad">${[['Customer contacted support regarding failed withdrawal.','Daniel Mwansa','User · ZM-100000'],['Provider reconciliation requires follow-up.','Administrator','Transaction · TX-20260818-1002'],['Review account after repeated failed payments.','Risk Team','Risk case · CASE-104']].map(x=>`<div class="note-row"><div class="note-main">${I.note}<div><strong>${x[0]}</strong><span>${x[1]} · ${x[2]}</span></div></div><small class="muted">18 Aug 2026</small></div>`).join('')}</div></section>`}
    function render(){document.getElementById('app').innerHTML=shell(page())}
    function replaceWithLiveUsers(rows){
      if(!Array.isArray(rows)||!rows.length)return;
      users=rows.map((p,i)=>({
        id:p.id, displayId:p.zedmoney_id||p.id, name:p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||p.email||p.id,
        phone:p.phone||'—', email:p.email||'—', wallet:p.wallet_identifier||'—', balance:Number(p.available_balance||0),
        status:(p.status||'active').replace(/^./,m=>m.toUpperCase()), verification:(p.verification_status||'unverified').replace(/^./,m=>m.toUpperCase()),
        last:p.updated_at?new Date(p.updated_at).toLocaleString():'—', created:p.created_at?new Date(p.created_at).toLocaleDateString():'—'
      }));
    }
    function replaceWithLiveTransactions(rows){
      if(!Array.isArray(rows)||!rows.length)return;
      const byId=new Map(users.map(u=>[u.id,u]));
      transactions=rows.map(t=>({
        id:t.id, user:byId.get(t.user_id)||{id:t.user_id,name:'Unknown user',displayId:t.user_id,wallet:'—'},
        type:String(t.type||'transaction').replace(/^./,m=>m.toUpperCase()), amount:Number(t.amount||0), fee:Number(t.fee||0),
        status:String(t.status||'pending').replace(/^./,m=>m.toUpperCase()), provider:t.provider||'—', method:t.method||'—',
        date:t.created_at?new Date(t.created_at).toLocaleString():'—', providerRef:t.provider_reference||'—'
      }));
      deposits=transactions.filter(t=>t.type==='Deposit'); withdrawals=transactions.filter(t=>t.type==='Withdrawal'); transfers=transactions.filter(t=>t.type==='Transfer');
    }
    async function loadLiveAdminData(api){
      const results=await Promise.allSettled([
        api('/api/admin/users?limit=100'),
        api('/api/admin/transactions'),
        api('/api/admin/overview'),
        api('/api/admin/audit')
      ]);
      const [userResult,txResult,overviewResult,auditResult]=results;
      if(userResult.status==='fulfilled')replaceWithLiveUsers(userResult.value);
      if(txResult.status==='fulfilled')replaceWithLiveTransactions(txResult.value);
      if(auditResult.status==='fulfilled'&&Array.isArray(auditResult.value))state.audit=auditResult.value.map(a=>({time:a.created_at?new Date(a.created_at).toLocaleString():'—',action:a.action||'—',target:a.target_id||'—',ref:a.id||'—',reason:a.reason||'—'}));
      if(overviewResult.status==='fulfilled')state.remoteOverview=overviewResult.value;
      render();
      const loaded=results.filter(r=>r.status==='fulfilled').length;
      showToast(`Live admin data loaded (${loaded}/4 data groups)`);
    }
    function navigate(view){state.previous=state.view;state.view=view;state.page=1;state.query='';state.drawer=false;state.modal=null;history.pushState({view},'',`#${view}`);render();window.scrollTo({top:0,behavior:'smooth'})}
    function goBack(){navigate(state.previous||'overview')}function toggleDrawer(v){state.drawer=v;render()}async function openUser(id){let u=users.find(x=>x.id===id);if(!u)return;try{const result=await window.zedmoneyAdmin?.api?.(`/api/admin/users/${encodeURIComponent(id)}`);const p=result?.profile,w=result?.wallet;if(p||w){u={...u,name:p?.display_name||[p?.first_name,p?.last_name].filter(Boolean).join(' ')||u.name,phone:p?.phone||u.phone,email:p?.email||u.email,displayId:p?.zedmoney_id||u.displayId,status:(p?.status||u.status).replace(/^./,m=>m.toUpperCase()),verification:(p?.verification_status||u.verification).replace(/^./,m=>m.toUpperCase()),wallet:w?.wallet_identifier||u.wallet,balance:Number(w?.available_balance??u.balance),created:p?.created_at?new Date(p.created_at).toLocaleDateString():u.created};const i=users.findIndex(x=>x.id===id);if(i>=0)users[i]=u;}}catch{showToast('Could not load full user details')}state.modal={type:'user',data:u};render()}function openTx(id){state.modal={type:'tx',data:transactions.find(t=>t.id===id)};render()}function openWallet(id){showToast(`${id} wallet view opened`)}function openAction(target,label){state.modal={type:'action',target,label};render()}function closeModal(){state.modal=null;render()}
    function confirmAction(target,label){const u=users.find(x=>x.id===target);if(u){if(label.includes('Suspend'))u.status='Suspended';if(label.includes('Restrict'))u.status='Restricted';if(label.includes('Unfreeze'))u.status='Active';state.audit.unshift({time:'Just now',action:label,target:u.name,ref:'ADM-'+Math.floor(10000+Math.random()*89999),reason:'Admin action'});}closeModal();showToast(label+' requires the authenticated admin backend')}
    function applyAdjustment(){state.audit.unshift({time:'Just now',action:'Created balance adjustment',target:'ZM-WALLET-1928',ref:'ADJ-83921',reason:'Manual correction'});closeModal();showToast('Adjustment requires the authenticated admin ledger backend')}
    function restoreUser(id){const u=users.find(x=>x.id===id);if(u)u.status='Active';state.audit.unshift({time:'Just now',action:'Restored user',target:u?.name||id,ref:'ADM-RESTORE',reason:'Admin review'});render();showToast('Account restored')}
    function showConfirm(title,copy,label,action){document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop open" id="confirm-modal" onclick="if(event.target===this)document.getElementById('confirm-modal').remove()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="icon" onclick="document.getElementById('confirm-modal').remove()">${I.close}</button></div><div class="modal-body"><div class="notice warning">${I.alert}<span>${copy}</span></div><div class="form-actions"><button class="secondary" onclick="document.getElementById('confirm-modal').remove()">Cancel</button><button class="primary" onclick="document.getElementById('confirm-modal').remove();${action}">${label}</button></div></div></div></div>`)}
    function showToast(message){const e=document.createElement('div');e.className='toast';e.innerHTML=`${I.check}<span>${message}</span>`;document.getElementById('toasts').appendChild(e);setTimeout(()=>e.remove(),3200)}
    function exportCSV(){const blob=new Blob(['ZedMoney admin export\\nThis is mock data for the frontend prototype.'],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zedmoney-admin-export.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);showToast('CSV export started')}
    function openSearch(){document.querySelector('.global-search input')?.focus()}function globalSearch(value){state.query=value;if(value.length>2&&value.toLowerCase().includes('zm-'))showToast('Search results available in Users and Wallets')}function toggleMaintenance(){showConfirm('Enable maintenance mode?','This setting requires authenticated backend authorization.','Enable maintenance',"state.maintenance=true;render();showToast('Maintenance mode enabled')")}
    document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();openSearch()}if(e.key==='Escape'){state.drawer=false;state.modal=null;document.querySelectorAll('.modal-backdrop').forEach(x=>x.remove());render()}})
    window.addEventListener('popstate',()=>{state.view=location.hash.slice(1)||'overview';render()});state.view=location.hash.slice(1)||'overview';render();setTimeout(()=>document.getElementById('loading').classList.add('hide'),700);setInterval(()=>{if(state.view==='overview'&&!state.modal){const feed=document.querySelector('.live-list');if(feed){const first=feed.firstElementChild;if(first){first.classList.add('new');setTimeout(()=>first.classList.remove('new'),1000)}}}},9000)
  </script>
  <script>
    (() => {
      const gate=document.getElementById('admin-auth'), form=document.getElementById('admin-login'), error=document.getElementById('admin-error'), button=document.getElementById('admin-submit');
       const apiBaseUrl=(document.querySelector('meta[name="zedmoney:api-base-url"]')?.content||'').trim().replace(/\/+$/,'');
       const api=async(path,options={})=>{
         if(!apiBaseUrl) throw new Error('The API base URL is missing from this page.');
         let r;
         try {
           r=await fetch(`${apiBaseUrl}${path}`,{
             credentials:'include',
             headers:{'Content-Type':'application/json',...(options.headers||{})},
             ...options
           });
         } catch {
           throw new Error(`Could not reach the API at ${apiBaseUrl}. Check the API service and browser CORS settings.`);
         }
         const body=await r.json().catch(()=>({}));
          if(!r.ok) {
            const detail=body.error?.message||body.message||`API request failed (${r.status}).`;
            throw new Error(`${detail} [HTTP ${r.status}]`);
          }
         return body.data;
       };
       const unlock=async()=>{
         gate.remove();
         document.body.classList.add('admin-ready');
         // Keep the spinner visible while waking a sleeping Render API and
         // attempting to load live data. Supabase remains required for admin
         // authentication and live database access.
         document.getElementById('loading')?.classList.remove('hide');
         try { await loadLiveAdminData(api); } finally { document.getElementById('loading')?.classList.add('hide'); }
       };
      api('/api/admin/session').then(unlock).catch(()=>{});
      form.onsubmit=async e=>{e.preventDefault();error.textContent='';button.disabled=true;button.textContent='Signing in…';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('admin-password').value})});await unlock();}catch(err){error.textContent=err.message;}finally{button.disabled=false;button.textContent='Sign in';}};
      window.zedmoneyAdmin={api,loadLiveAdminData,logout:async()=>{await api('/api/admin/logout',{method:'POST'});location.reload();}};
    })();
  </script>
</body>
