  <div id="app"></div>
  <div id="admin-auth" style="position:fixed;inset:0;z-index:200;background:#f4f7f9;display:grid;place-items:center;padding:20px">
    <form id="admin-login" style="width:min(390px,100%);background:#fff;border:1px solid #dfe7eb;border-radius:12px;padding:28px;box-shadow:0 20px 55px rgba(5,29,46,.14)">
      <div style="display:flex;align-items:center;gap:10px;color:#091f32;margin-bottom:25px"><strong style="font-size:19px">ZedMoney</strong><span style="color:#697a86;font-size:12px">Admin console</span></div>
      <h1 style="font-size:23px;margin:0 0 6px;color:#122330">Administrator sign in</h1><p style="font-size:12px;color:#697a86;margin:0 0 20px">Use your administrator password to continue.</p>
      <label for="admin-password" style="display:block;font-size:11px;font-weight:700;color:#405762;margin-bottom:7px">Admin password</label><input id="admin-password" type="password" autocomplete="current-password" required style="width:100%;height:40px;border:1px solid #cfdbe1;border-radius:7px;padding:0 10px">
      <p id="admin-error" style="min-height:18px;color:#b94d4d;font-size:11px;margin:10px 0"></p><button id="admin-submit" type="submit" style="width:100%;height:40px;background:#0d3653;color:#fff;border-radius:7px;font-weight:700">Sign in</button>
    </form>
  </div>
  <div class="loading" id="loading"><div class="loading-box">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 3.5 40 9v12.3c0 10.1-6.5 18.9-16 23.2-9.5-4.3-16-13.1-16-23.2V9L24 3.5Z"/><path fill="#79c4c7" d="M24 9.2 34.4 13v8.1c0 6.9-4.1 13-10.4 16.5-6.3-3.5-10.4-9.6-10.4-16.5V13L24 9.2Z"/><path fill="#fff" d="m17.6 23.3 4.2 4.2 9.1-10.1 2.2 2-11.2 12.5-6.4-6.4 2.1-2.2Z"/></svg>
    <div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><h2>Loading admin console</h2><p>Preparing operational data</p>
  </div></div>
  <div class="toast-stack" id="toasts" aria-live="polite"></div>
  <script>
    const I={
      grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
      users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3"/><path d="M3.5 20c.7-3.2 2.6-5 5.5-5s4.8 1.8 5.5 5M16 11a3 3 0 1 0 0-6M16 15c2.6.1 4.1 1.7 4.7 4.5"/></svg>',
      wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7.5h15.5A1.5 1.5 0 0 1 21 9v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h13"/><path d="M17 13h4M17 13a2 2 0 1 0 0 4h4"/></svg>',
      send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m21 3-7.2 18-3.5-7.3L3 10.2 21 3Z"/><path d="M10.3 13.7 21 3"/></svg>',
      receive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v15M6 12l6 6 6-6M5 21h14"/></svg>',
      card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></svg>',
      link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 13.5a4.5 4.5 0 0 0 6.4.1l2-2a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2M14 10.5a4.5 4.5 0 0 0-6.4-.1l-2 2A4.5 4.5 0 0 0 12 18.8l1.2-1.2"/></svg>',
      clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3 20 6v5.5c0 4.8-3.3 8.7-8 10.5-4.7-1.8-8-5.7-8-10.5V6l8-3Z"/><path d="m8.5 12 2.3 2.3 4.8-5"/></svg>',
      settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="m19.4 15 .1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.2a2 2 0 1 1-4 0v-.2a2 2 0 0 0-3.4-1.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A2 2 0 0 0 3.7 12a2 2 0 0 0-.1-1.1l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A2 2 0 0 0 9.8 6.7V6.5a2 2 0 1 1 4 0v.2a2 2 0 0 0 3.4 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a2 2 0 0 0 1.4 3.4h.2"/></svg>',
      alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 4 3 20h18L12 4Z"/><path d="M12 9v5M12 17h.01"/></svg>',
      search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>',
      close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 6 12 12M18 6 6 18"/></svg>',
      back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
      arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
      plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>',
      check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m5 12 4.5 4.5L19 7"/></svg>',
      lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
      unlock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7-2"/></svg>',
      download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
      refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4"/></svg>',
      menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
      bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',
      note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h5"/></svg>',
      database:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg>',
      help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 1 1 3.9 1.9c-1.2.8-1.6 1.2-1.6 2.6M12 17h.01"/></svg>'
    };
    const logo='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 3.5 40 9v12.3c0 10.1-6.5 18.9-16 23.2-9.5-4.3-16-13.1-16-23.2V9L24 3.5Z"/><path fill="#79c4c7" d="M24 9.2 34.4 13v8.1c0 6.9-4.1 13-10.4 16.5-6.3-3.5-10.4-9.6-10.4-16.5V13L24 9.2Z"/><path fill="#fff" d="m17.6 23.3 4.2 4.2 9.1-10.1 2.2 2-11.2 12.5-6.4-6.4 2.1-2.2Z"/></svg>';
    const money=n=>`K ${Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
    const names=[];
    // All operational records are loaded from the authenticated API below.
    // Keep the initial state empty so a disconnected backend can never look like production data.
    let users=[];
    const txTypes=['Deposit','Transfer','Withdrawal','Airtime','Payment link','Refund'];
    let transactions=[], deposits=[], withdrawals=[], transfers=[], links=[], audits=[], securityEvents=[], cases=[];
     let state={view:'overview',previous:'overview',drawer:false,modal:null,query:'',userFilter:'All',txFilter:'All statuses',page:1,notifications:true,maintenance:false,system:'operational',selectedUser:null,selectedTx:null,audit:[],remoteOverview:null,liveTables:{},liveErrors:{},bonusSettings:null,bonusRecipients:[],withdrawalSettings:null};
     const navGroups=[['Overview',[['overview','Overview','grid'],['users','Users','users'],['wallets','Wallets','wallet'],['transactions','Transactions','clock'],['deposits','Deposits','receive'],['withdrawals','Withdrawals','send'],['transfers','Transfers','send'],['payment-links','Payment Links','link'],['merchants','Merchants','users']]],['Financial operations',[['ledger','Ledger','database'],['adjustments','Balance adjustments','note'],['reconciliation','Reconciliation','refresh'],['fees','Fees','card'],['limits','Limits','shield'],['bonus-recipients','Signup bonuses','note']]],['Risk & security',[['risk','Fraud & risk','alert'],['suspended','Suspended accounts','lock'],['frozen','Frozen wallets','lock'],['security-events','Security events','shield'],['sessions','Sessions','users']]],['Operations',[['webhooks','Webhooks','refresh'],['provider','Provider status','card'],['jobs','Background jobs','clock'],['health','System health','grid']]],['Support',[['cases','Support cases','note'],['notes','Admin notes','note']]],['System',[['notifications','Notifications','bell'],['audit','Audit logs','note'],['settings','Settings','settings'],['permissions','Permissions','users'],['admin-profile','Admin profile','users']]]];
    function pageTitle(){for(const g of navGroups)for(const n of g[1])if(n[0]===state.view)return n[1];return 'Overview'}
    function nav(){return navGroups.map(g=>`<div class="nav-label">${g[0]}</div><div class="nav">${g[1].map(n=>`<button class="${state.view===n[0]?'active':''}" onclick="navigate('${n[0]}')">${I[n[2]]||I.grid}<span>${n[1]}</span></button>`).join('')}</div>`).join('')}
    function brand(){return `<a class="brand" href="#" onclick="navigate('overview');return false">${logo}<span><b>ZedMoney</b><small>Admin Console</small></span></a>`}
     function shell(content){return `<div class="shell"><aside class="sidebar">${brand()}${nav()}<div class="admin-profile"><span class="avatar admin">SA</span><div><strong>Administrator</strong><span>System Admin</span></div><button onclick="zedmoneyAdmin.logout()" aria-label="Sign out">${I.arrow}</button></div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="icon menu-btn" onclick="toggleDrawer(true)" aria-label="Open menu">${I.menu}</button>${state.view!=='overview'?`<button class="icon" onclick="goBack()" aria-label="Back">${I.back}</button>`:''}<div><div class="page-kicker">ZedMoney operations</div><h2 class="page-title">${pageTitle()}</h2></div></div><div class="top-actions"><div class="global-search">${I.search}<input placeholder="Search ZedMoney  ( / )" value="${state.query}" oninput="globalSearch(this.value)" onclick="openSearch()"></div><button class="icon relative" onclick="navigate('notifications')" aria-label="Notifications">${I.bell}<i class="notification-dot"></i></button><button class="system-status" onclick="navigate('provider')"><i></i> Systems operational</button><span class="avatar admin">SA</span></div></header><div class="content">${content}</div></main><nav class="bottom">${[['overview','Home','grid'],['users','Users','users'],['transactions','Txns','clock'],['risk','Risk','alert'],['menu','Menu','menu']].map(n=>`<button class="${state.view===n[0]?'active':''}" onclick="${n[0]==='menu'?'toggleDrawer(true)':`navigate('${n[0]}')`}">${I[n[2]]}<span>${n[1]}</span></button>`).join('')}</nav></div>${drawer()}${modal()}</div>`}
    function drawer(){return `<div class="drawer-backdrop ${state.drawer?'open':''}" onclick="toggleDrawer(false)"></div><aside class="drawer ${state.drawer?'open':''}"><button class="icon close" onclick="toggleDrawer(false)">${I.close}</button>${brand()}${nav()}</aside>`}
    function heading(title,desc,actions=''){return `<div class="heading"><div>${state.view!=='overview'?`<button class="text-btn" onclick="goBack()" style="display:flex;align-items:center;gap:5px;margin-bottom:10px">${I.back} Back</button>`:''}<h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`}
    function badge(s){const c={'Successful':'success','Active':'active','Completed':'success','Operational':'success','Verified':'success','Pending':'pending','Processing':'processing','Suspended':'suspended','Frozen':'frozen','Restricted':'restricted','Failed':'failed','High Risk':'high','Critical':'critical','Medium':'medium'}[s]||'neutral';return `<span class="badge ${c}">${s}</span>`}
    function person(u){return `<span class="person"><span class="avatar">${u.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</span><span><b>${u.name}</b><small>${u.displayId||u.id}</small></span></span>`}
    function tableToolbar(placeholder='Search records',filters=''){return `<div class="toolbar"><div class="search">${I.search}<input placeholder="${placeholder}" value="${state.query}" oninput="state.query=this.value;state.page=1;render()"></div><div class="filter-group">${filters}<button class="secondary" onclick="exportCSV()">${I.download} Export</button></div></div>`}
    function pagination(total){return `<div class="pagination"><span>Showing ${Math.min(total,(state.page-1)*8+1)}–${Math.min(total,state.page*8)} of ${total}</span><div class="page-btns"><button onclick="state.page=Math.max(1,state.page-1);render()">‹</button><button onclick="state.page++;render()">›</button></div></div>`}
     function overview(){const o=state.remoteOverview||{};const cards=[['Total users',o.users||0,'From profiles','good'],['Total wallets',o.wallets||0,'From wallets','good'],['Total transactions',o.transactions||0,'Recorded transactions','good'],['Pending transactions',o.pending_transactions||0,'Pending or processing','warn'],['Suspended accounts',o.suspended_users||0,'Current account status','warn'],['Frozen wallets',o.frozen_wallets||0,'Current wallet status','warn']];return `<section class="view">${heading('Operational overview','Authoritative counts and records from the authenticated ZedMoney API.')}<div class="stat-grid">${cards.map(x=>`<div class="card stat"><div class="stat-label">${x[0]}</div><div class="stat-value">${Number(x[1]).toLocaleString()}</div><div class="stat-meta ${x[3]}">${x[2]}</div></div>`).join('')}</div><div class="dashboard-grid"><div class="card chart-card"><div class="chart-head"><div><h2>Latest transactions</h2><p>Loaded from the database</p></div><span class="badge success">Live</span></div>${transactions.length?transactionMini():`<div class="empty">${I.database}<h3>No transactions returned</h3><p>The API returned no records for this account.</p></div>`}</div><div class="card pad"><div class="card-title"><div><h2>Live activity</h2><p>Latest database records</p></div><span class="badge success">Live</span></div>${transactions.slice(0,5).map(t=>`<div class="live-item"><time class="live-time">${t.date}</time><span class="live-icon">${I[t.type==='Deposit'?'receive':'send']}</span><span class="live-copy"><strong>${t.type}</strong><span>${t.user.name} · ${money(Math.abs(t.amount))}</span></span>${badge(t.status)}</div>`).join('')||'<div class="empty">No activity returned.</div>'}</div></div></section>`}
     function transactionMini(){return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Reference</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody>${transactions.slice(0,8).map(t=>`<tr onclick="openTx('${t.id}')"><td>${t.date}</td><td>${t.id}</td><td>${t.type}</td><td>${money(Math.abs(t.amount))}</td><td>${badge(t.status)}</td></tr>`).join('')}</tbody></table></div>`}
    function chart(){return `<div class="chart"><svg viewBox="0 0 800 225" preserveAspectRatio="none"><path d="M0 176 C45 152 70 168 108 149 S175 130 215 151 S260 107 312 125 S372 83 420 114 S486 100 520 112 S580 60 625 91 S688 55 735 72 S770 47 800 54" fill="none" stroke="#166083" stroke-width="3"/><path d="M0 195 C52 185 71 194 108 180 S169 171 215 181 S272 159 312 168 S367 142 420 154 S475 145 520 153 S580 125 625 141 S687 116 735 130 S770 104 800 118" fill="none" stroke="#79c4c7" stroke-width="2"/><path d="M0 176 C45 152 70 168 108 149 S175 130 215 151 S260 107 312 125 S372 83 420 114 S486 100 520 112 S580 60 625 91 S688 55 735 72 S770 47 800 54 L800 225 L0 225Z" fill="#166083" opacity=".07"/></svg></div><div class="chart-labels"><span>01 Aug</span><span>08 Aug</span><span>15 Aug</span><span>22 Aug</span><span>Today</span></div>`}
    function usersPage(){let list=users.filter(u=>{const q=state.query.toLowerCase();return(!q||[u.name,u.id,u.phone,u.email].join(' ').toLowerCase().includes(q))&&(state.userFilter==='All'||u.status===state.userFilter)});return `<section class="view">${heading('Users','Manage wallet customers, account status and operational actions.',`<button class="primary" onclick="showToast('User creation is a backend workflow')">${I.plus} Add user</button>`)}<div class="card table-card">${tableToolbar('Search name, ID, phone or email',`<select class="filter" onchange="state.userFilter=this.value;state.page=1;render()"><option>All</option><option>Active</option><option>Suspended</option><option>Restricted</option><option>Pending verification</option></select>`)}<div class="table-wrap"><table><thead><tr><th>User</th><th>Phone</th><th>Wallet</th><th>Balance</th><th>Status</th><th>Verification</th><th>Last active</th><th>Created</th><th>Actions</th></tr></thead><tbody>${list.slice((state.page-1)*8,state.page*8).map(u=>`<tr onclick="openUser('${u.id}')"><td>${person(u)}</td><td>${u.phone}</td><td>${u.wallet}</td><td style="font-weight:700">${money(u.balance)}</td><td>${badge(u.status)}</td><td>${badge(u.verification)}</td><td>${u.last}</td><td>${u.created}</td><td><div class="row-actions" onclick="event.stopPropagation()"><button onclick="openUser('${u.id}')">${I.arrow}</button><button onclick="openAction('${u.id}','Suspend user')">${I.lock}</button></div></td></tr>`).join('')}</tbody></table></div>${pagination(list.length)}</div></section>`}
    function walletsPage(){return `<section class="view">${heading('Wallets','Review wallet balances, status and money movement controls.')}<div class="card table-card">${tableToolbar('Search wallet ID or user',`<select class="filter"><option>All statuses</option><option>Active</option><option>Frozen</option><option>Restricted</option></select>`)}<div class="table-wrap"><table><thead><tr><th>Wallet ID</th><th>User</th><th>Currency</th><th>Available</th><th>Pending</th><th>Reserved</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead><tbody>${users.slice(0,12).map((u,i)=>`<tr><td>${u.wallet}</td><td>${person(u)}</td><td>ZMW</td><td style="font-weight:700">${money(u.balance)}</td><td>${money(i%3?0:600)}</td><td>${money(i%4?0:1200)}</td><td>${badge(i===4?'Frozen':u.status)}</td><td>${u.last}</td><td><div class="row-actions"><button onclick="openWallet('${u.wallet}')">${I.arrow}</button><button onclick="openAction('${u.id}','Freeze wallet')">${I.lock}</button></div></td></tr>`).join('')}</tbody></table></div>${pagination(24)}</div></section>`}
    function transactionTable(title,desc,list=transactions){return `<section class="view">${heading(title,desc,`<button class="secondary" onclick="exportCSV()">${I.download} Export</button>`)}<div class="card table-card">${tableToolbar('Search ID, provider ref, user or phone',`<select class="filter"><option>All statuses</option><option>Successful</option><option>Pending</option><option>Failed</option></select><select class="filter"><option>All types</option><option>Deposit</option><option>Withdrawal</option><option>Transfer</option></select>`)}<div class="table-wrap"><table><thead><tr><th>Date</th><th>Transaction ID</th><th>User</th><th>Type</th><th>Amount</th><th>Fee</th><th>Provider</th><th>Status</th><th>Method</th><th>Actions</th></tr></thead><tbody>${list.slice(0,12).map(t=>`<tr onclick="openTx('${t.id}')"><td>${t.date}</td><td>${t.id}</td><td>${t.user.name}</td><td>${t.type}</td><td style="font-weight:700">${money(Math.abs(t.amount))}</td><td>${money(t.fee)}</td><td>${t.provider}</td><td>${badge(t.status)}</td><td>${t.method}</td><td><div class="row-actions" onclick="event.stopPropagation()"><button onclick="openTx('${t.id}')">${I.arrow}</button><button onclick="openAction('${t.id}','Reverse transaction')">${I.refresh}</button></div></td></tr>`).join('')}</tbody></table></div>${pagination(list.length)}</div></section>`}
    function depositsPage(){return transactionTable('Deposits','Incoming wallet funding across providers.',deposits)}function withdrawalsPage(){return transactionTable('Withdrawals','Review and action outgoing withdrawal requests.',withdrawals)}function transfersPage(){return transactionTable('Transfers','Movement between ZedMoney users.',transfers)}
    function genericTable(view){const configs={ 'payment-links':['Payment links','Manage payment requests and collection performance',['Link','Owner','Amount','Payments','Collected','Status','Created','Expiry']],merchants:['Merchants','Manage business accounts and settlement status',['Merchant','Merchant ID','Owner','Status','Total sales','Settlement','Risk status']],ledger:['Ledger','Immutable financial records for wallet movement.',['Entry ID','Wallet','Transaction','Direction','Amount','Balance before','Balance after','Entry type']],reconciliation:['Reconciliation','Compare provider records with internal financial records.',['Issue','Provider','Internal','Difference','Status','Action']],webhooks:['Webhooks','Monitor provider events and retry processing when needed.',['Event ID','Provider','Event type','Transaction ID','Received','Processed','Status']],audit:['Audit logs','Administrative actions are recorded and cannot be edited.',['Timestamp','Admin','Action','Target','Reason','Reference']],cases:['Support cases','Operational cases and requests from wallet users.',['Case ID','User','Subject','Priority','Status','Assigned admin']]};const c=configs[view]||[pageTitle(),'Operational records for this section.',['ID','Name','Status','Updated','Actions']];let rows='';if(view==='payment-links')rows=links.map(x=>`<tr><td>${x.id} · ${x.name}</td><td>${x.owner.name}</td><td>${money(x.amount)}</td><td>${x.payments}</td><td>${money(x.amount*x.payments*.8)}</td><td>${badge(x.status)}</td><td>${x.created}</td><td>${x.expiry}</td></tr>`).join('');else if(view==='merchants')rows=users.slice(0,8).map((u,i)=>`<tr><td><b>${['Manda Hill Market','Kwacha Eats','Lusaka Design Co','Copperbelt Supplies','Kabulonga Pharmacy','Mosi Events','ZedShop','Northmead Cafe'][i]}</b></td><td>MER-${100+i}</td><td>${u.name}</td><td>${badge(i===3?'Pending':'Active')}</td><td>${money(45000+i*7310)}</td><td>${badge('Active')}</td><td>${badge(i===5?'High Risk':'Low')}</td></tr>`).join('');else if(view==='ledger')rows=transactions.slice(0,12).map((t,i)=>`<tr><td>LED-${9000+i}</td><td>${t.user.wallet}</td><td>${t.id}</td><td>${t.amount>0?'Credit':'Debit'}</td><td>${money(Math.abs(t.amount))}</td><td>${money(12800+i*17)}</td><td>${money(12800+i*17+(t.amount>0?Math.abs(t.amount):-Math.abs(t.amount)))}</td><td>${t.type}</td></tr>`).join('');else if(view==='reconciliation')rows=['Missing webhook','Amount mismatch','Duplicate webhook','Unknown provider transaction'].map((x,i)=>`<tr><td>${x}</td><td>${money(500+i*125)}</td><td>${money(500+i*100)}</td><td>${money(25+i*25)}</td><td>${badge(i===2?'Resolved':'Pending')}</td><td><button class="secondary" onclick="showToast('Review opened')">Review</button></td></tr>`).join('');else if(view==='webhooks')rows=Array.from({length:10},(_,i)=>`<tr><td>EVT-${8100+i}</td><td>Lipila</td><td>${['collection.completed','withdrawal.pending','webhook.received','payment.failed'][i%4]}</td><td>${transactions[i].id}</td><td>10:${42-i}</td><td>${i%5===0?'—':'10:4'+i}</td><td>${badge(i%5===0?'Failed':i%3===0?'Duplicate':'Processed')}</td></tr>`).join('');else if(view==='audit')rows=state.audit.map(a=>`<tr><td>${a.time}</td><td>Administrator</td><td>${a.action}</td><td>${a.target}</td><td>${a.reason}</td><td>${a.ref}</td></tr>`).join('');else if(view==='cases')rows=cases.map(ca=>`<tr><td>${ca.id}</td><td>${ca.user.name}</td><td>${ca.subject}</td><td>${badge(ca.priority)}</td><td>${badge(ca.status)}</td><td>${ca.admin}</td></tr>`).join('');else rows=users.slice(0,10).map((u,i)=>`<tr><td>${u.id}</td><td>${u.name}</td><td>${badge(i%3?'Active':'Pending')}</td><td>${u.last}</td><td><button class="secondary" onclick="showToast('Record opened')">View</button></td></tr>`).join('');return `<section class="view">${heading(c[0],c[1],`<button class="secondary" onclick="exportCSV()">${I.download} Export</button>`)}${view==='ledger'?`<div class="notice spacer">${I.database}<span>Ledger entries are immutable financial records. Balance changes should create audited ledger events rather than overwrite a balance.</span></div>`:''}<div class="card table-card spacer">${tableToolbar('Search '+c[0].toLowerCase())}<div class="table-wrap"><table><thead><tr>${c[2].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>${pagination(Math.max(12,rows.split('<tr>').length-1))}</div></section>`}
    function adjustments(){return `<section class="view">${heading('Balance adjustments','Every credit, debit, reserve and release is an audited financial operation.')}<div class="card pad"><div class="notice">${I.database}<span>Adjustments are created only through the authenticated admin backend. No sample adjustment records are displayed.</span></div><div class="empty">${I.database}<h3>No live adjustments loaded</h3><p>Load adjustment records from the backend before displaying them here.</p></div></div></section>`}
    function risk(){const high=users.slice(0,8);return `<section class="view">${heading('Fraud & risk','Investigate unusual wallet activity and apply controlled restrictions.')}<div class="kpi-grid"><div class="kpi"><span>High-risk users</span><strong>18</strong><small>+3 this week</small></div><div class="kpi"><span>Suspicious transactions</span><strong>24</strong><small>5 need review</small></div><div class="kpi"><span>Failed payment clusters</span><strong>7</strong><small>Across 4 accounts</small></div><div class="kpi"><span>Risk cases open</span><strong>12</strong><small>2 critical</small></div></div><div class="card table-card spacer">${tableToolbar('Search risk cases',`<select class="filter"><option>All risk levels</option><option>High</option><option>Critical</option><option>Medium</option></select>`)}<div class="table-wrap"><table><thead><tr><th>User</th><th>Signal</th><th>Risk score</th><th>Failed txns</th><th>Last activity</th><th>Level</th><th>Actions</th></tr></thead><tbody>${high.map((u,i)=>`<tr><td>${person(u)}</td><td>${['Rapid transfers','Repeated failed payments','Unusual withdrawal','Multiple account activity'][i%4]}</td><td><b>${82-i*4} / 100</b></td><td>${5+i}</td><td>${u.last}</td><td>${badge(i<2?'Critical':i<5?'High Risk':'Medium')}</td><td><button class="secondary" onclick="openUser('${u.id}')">Review</button></td></tr>`).join('')}</tbody></table></div></div></section>`}
     function frozenPage(){const frozen=users.filter(u=>u.walletStatus==='Frozen');return `<section class="view">${heading('Frozen wallets','Wallets temporarily unable to perform money movement.') }<div class="notice warning">${I.lock}<span>Only wallets returned by the authenticated admin API are shown here.</span></div><div class="card table-card spacer">${frozen.length?`<div class="table-wrap"><table><thead><tr><th>Wallet</th><th>User</th><th>Balance</th><th>Status</th><th>Action</th></tr></thead><tbody>${frozen.map(u=>`<tr><td>${u.wallet}</td><td>${person(u)}</td><td>${money(u.balance)}</td><td>${badge(u.walletStatus)}</td><td><button class="secondary" onclick="openAction('${u.id}','Unfreeze wallet')">${I.unlock} Unfreeze</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${I.database}<h3>No frozen wallets returned</h3><p>The authenticated admin API returned no frozen wallet records.</p></div>`}</div></section>`}
     function suspendedPage(){const suspended=users.filter(u=>u.status==='Suspended');return `<section class="view">${heading('Suspended accounts','Accounts placed on hold with a visible reason and audit trail.') }<div class="card table-card">${suspended.length?`<div class="table-wrap"><table><thead><tr><th>User</th><th>Status</th><th>Last updated</th><th>Action</th></tr></thead><tbody>${suspended.map(u=>`<tr><td>${person(u)}</td><td>${badge(u.status)}</td><td>${u.last}</td><td><button class="secondary" onclick="showConfirm('Restore account?','Restore this account through the authenticated admin backend.','Restore','restoreUser(\\'${u.id}\\')')">Restore</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${I.database}<h3>No suspended accounts returned</h3><p>The authenticated admin API returned no suspended users.</p></div>`}</div></section>`}
     function provider(){return `<section class="view">${heading('Provider status','Payment-provider health and recent operational signals.') }<div class="card pad"><div class="card-title"><div><h2>Payment Provider · Lipila</h2><p>No provider status record has been loaded from the authenticated admin API.</p></div><span class="badge neutral">Unavailable</span></div><div class="empty">${I.database}<h3>No live provider status</h3><p>Configure Lipila on the server and load its provider-status endpoint before displaying operational measurements.</p></div></div></section>`}
     function health(){return `<section class="view">${heading('System health','Live health measurements are shown only when returned by the authenticated backend.') }<div class="card pad"><div class="empty">${I.database}<h3>No live health measurements</h3><p>The backend does not currently expose a system-health dataset for this console.</p></div></div></section>`}
    function notificationsPage(){return `<section class="view">${heading('Notifications','Operational notifications returned by the authenticated admin API.')}<div class="card pad"><div class="empty">${I.database}<h3>No live notifications returned</h3><p>Notifications will appear here when the backend returns them.</p></div></div></section>`}
    function sessions(){return `<section class="view">${heading('Sessions','Review active administrator and user sessions.') }<div class="card pad"><div class="empty">${I.database}<h3>No live sessions loaded</h3><p>Sessions will appear here when returned by the authenticated admin API.</p></div></div></section>`}
    function adminProfile(){return `<section class="view">${heading('Admin profile','Administrator profile and permissions.') }<div class="wide-grid"><div class="card pad"><div class="person" style="margin-bottom:22px"><span class="avatar admin" style="width:54px;height:54px;font-size:16px">SA</span><span><b style="font-size:17px">Administrator</b><small>System Admin</small></span></div><div class="detail-list"><div class="detail-row"><span>Admin ID</span><strong>ADM-001</strong></div><div class="detail-row"><span>Email</span><strong>admin@example.test</strong></div><div class="detail-row"><span>Last login</span><strong>Today, 09:14 · Chrome</strong></div><div class="detail-row"><span>Session</span><strong style="color:var(--green)">Admin authentication not connected</strong></div></div></div><div class="card pad"><div class="card-title"><h2>Permissions</h2><span class="badge success">Super Admin</span></div>${['Users and support','Wallets and transactions','Financial operations','Risk and security','Provider operations','Platform settings'].map(x=>`<div class="detail-row"><span>${x}</span><strong style="color:var(--green)">${I.check} Full access</strong></div>`).join('')}<p class="helper spacer">Permissions are enforced by the backend once an authenticated admin identity is configured.</p></div></div></section>`}
    function permissions(){const roles=[['Super Admin','Everything'],['Operations Admin','Transactions, wallets, deposits, withdrawals'],['Support Admin','Users, cases, notes'],['Finance Admin','Ledger, reconciliation, adjustments'],['Risk Admin','Fraud, restrictions, suspensions']];return `<section class="view">${heading('Permissions','A future-ready role and permissions matrix.')}<div class="notice">${I.shield}<span>Roles and permissions are enforced server-side when an authenticated admin identity is configured.</span></div><div class="card table-card spacer"><div class="table-wrap"><table><thead><tr><th>Role</th><th>Overview</th><th>Financial operations</th><th>Risk & security</th><th>Support</th><th>System</th></tr></thead><tbody>${roles.map((r,i)=>`<tr><td><b>${r[0]}</b><br><small class="muted">${r[1]}</small></td><td>${badge('Active')}</td><td>${badge(i===2?'Restricted':'Active')}</td><td>${badge(i===3?'Restricted':'Active')}</td><td>${badge(i===3?'Restricted':'Active')}</td><td>${badge(i===0?'Active':'Restricted')}</td></tr>`).join('')}</tbody></table></div></div></section>`}
     function adminSettings(){return `<section class="view">${heading('Settings','Configure platform, financial, provider and security preferences.') }<div class="wide-grid">${bonusSettingsCard()}${withdrawalSettingsCard()}<div class="card pad"><div class="card-title"><h2>Platform</h2></div>${[['Currency','ZMW — Zambian Kwacha','select'],['Timezone','Africa/Nairobi','select'],['Maintenance mode','Requires backend authorization','switch'],['Admin notifications','Receive operational alerts','switch']].map(setting).join('')}</div><div class="card pad"><div class="card-title"><h2>Financial</h2></div>${[['Fees','Manage fee configuration','arrow'],['Limits','Configure transaction limits','arrow'],['Transaction settings','Statuses and retry behavior','arrow']].map(setting).join('')}</div><div class="card pad"><div class="card-title"><h2>Security</h2></div>${[['Session timeout','30 minutes','select'],['Admin sessions','Review active sessions','arrow'],['Audit settings','Records cannot be edited','arrow']].map(setting).join('')}</div><div class="card pad"><div class="card-title"><h2>Provider</h2></div>${[['Lipila status','Not connected','arrow'],['Webhook status','Not configured','arrow']].map(setting).join('')}</div></div></section>`}
     function bonusSettingsCard(){const b=state.bonusSettings||{enabled:false,amount:0,currency:'ZMW'};return `<div class="card pad"><div class="card-title"><div><h2>Signup bonus</h2><p>Applied once when a new account is created.</p></div>${badge(b.enabled?'Active':'Off')}</div><div class="form-grid"><div class="field"><label for="bonus-amount">Bonus amount</label><input id="bonus-amount" type="number" min="0" max="100000" step="0.01" value="${Number(b.amount||0)}"></div><div class="field"><label for="bonus-enabled">Bonus control</label><label style="display:flex;align-items:center;gap:9px;min-height:35px"><input id="bonus-enabled" type="checkbox" style="width:16px;min-height:16px" ${b.enabled?'checked':''}><span>${b.enabled?'Turned on for new signups':'Turned off for new signups'}</span></label></div></div><p class="helper" style="margin-top:12px">Changing this affects future signups only. Existing wallets and bonuses are not changed.</p><div class="form-actions"><button class="primary" onclick="saveBonusSettings()">Save bonus settings</button></div></div>`}
     function withdrawalSettingsCard(){const hours=Number(state.withdrawalSettings?.withdrawal_delay_hours??24);return `<div class="card pad"><div class="card-title"><div><h2>Withdrawal approval</h2><p>Automatic hold before the provider request is sent.</p></div><span class="badge active">${hours}h hold</span></div><div class="field"><label for="withdrawal-delay-hours">Automatic hold (hours)</label><input id="withdrawal-delay-hours" type="number" min="0" max="720" step="1" value="${hours}"><span class="helper">Set 0 for immediate automatic processing. Admins can approve any pending request immediately.</span></div><div class="form-actions"><button class="primary" onclick="saveWithdrawalSettings()">Save hold settings</button></div></div>`}
    function setting(x){return `<button class="detail-row" style="width:100%;background:none;text-align:left" onclick="${x[0]==='Maintenance mode'?'toggleMaintenance()':"showToast('Setting requires backend authorization')"}"><span><strong>${x[0]}</strong><small style="display:block;margin-top:4px">${x[1]}</small></span><span class="chevron">${x[2]==='switch'?`<span class="badge ${state.maintenance?'warning':'success'}">${state.maintenance?'Enabled':'Off'}</span>`:I.arrow}</span></button>`}
    function userModal(u){return `<div class="modal-head"><h2>${u.name}</h2><button class="icon" onclick="closeModal()">${I.close}</button></div><div class="modal-body"><div class="person" style="margin-bottom:18px">${person(u)}<span style="margin-left:auto">${badge(u.status)}</span></div><div class="detail-grid"><div class="detail-cell"><label>User ID</label><strong>${u.id}</strong></div><div class="detail-cell"><label>Phone</label><strong>${u.phone}</strong></div><div class="detail-cell"><label>Wallet</label><strong>${u.wallet}</strong></div><div class="detail-cell"><label>Available balance</label><strong>${money(u.balance)}</strong></div><div class="detail-cell"><label>Verification</label><strong>${u.verification}</strong></div><div class="detail-cell"><label>Last activity</label><strong>${u.last}</strong></div></div><div class="wide-grid spacer"><div><h3>Account information</h3><div class="detail-list"><div class="detail-row"><span>Email</span><strong>${u.email}</strong></div><div class="detail-row"><span>Country</span><strong>Zambia</strong></div><div class="detail-row"><span>Currency</span><strong>ZMW</strong></div><div class="detail-row"><span>Created</span><strong>${u.created}</strong></div></div></div><div><h3>Risk & security</h3><div class="detail-list"><div class="detail-row"><span>Risk level</span><strong>${badge(u.status==='Restricted'?'High Risk':'Low')}</strong></div><div class="detail-row"><span>Failed transactions</span><strong>${u.id.slice(-1)*1+2}</strong></div><div class="detail-row"><span>Active sessions</span><strong>${(u.id.slice(-1)*1)%3+1}</strong></div><div class="detail-row"><span>Security events</span><strong>2</strong></div></div></div></div><div class="notice spacer">${I.note}<span>Activity, restrictions and audit history and authorization are enforced by the backend when connected.</span></div><div class="modal-actions"><button class="secondary" onclick="openAction('${u.id}','Restrict user')">Restrict</button><button class="danger" onclick="openAction('${u.id}','Suspend user')">${I.lock} Suspend user</button><button class="primary" onclick="showToast('Wallet view opened')">View wallet ${I.arrow}</button></div></div>`}
     function txModal(t){return `<div class="modal-head"><h2>Transaction details</h2><button class="icon" onclick="closeModal()">${I.close}</button></div><div class="modal-body"><div class="detail-grid"><div class="detail-cell"><label>Transaction ID</label><strong>${t.id}</strong></div><div class="detail-cell"><label>Provider ID</label><strong>${t.providerRef}</strong></div><div class="detail-cell"><label>Status</label><strong>${t.status}</strong></div><div class="detail-cell"><label>User</label><strong>${t.user.name}</strong></div><div class="detail-cell"><label>Amount</label><strong>${money(Math.abs(t.amount))}</strong></div><div class="detail-cell"><label>Fee</label><strong>${money(t.fee)}</strong></div></div><div class="detail-list spacer"><div class="detail-row"><span>Wallet</span><strong>${t.user.wallet}</strong></div><div class="detail-row"><span>Net amount</span><strong>${money(Math.abs(t.amount)-t.fee)}</strong></div><div class="detail-row"><span>Currency</span><strong>${t.metadata?.currency||'ZMW'}</strong></div><div class="detail-row"><span>Provider</span><strong>${t.provider}</strong></div><div class="detail-row"><span>Payment method</span><strong>${t.method}</strong></div><div class="detail-row"><span>Provider message</span><strong>${t.providerMessage}</strong></div><div class="detail-row"><span>Created</span><strong>${t.date}</strong></div><div class="detail-row"><span>Description</span><strong>${t.type} for ${t.user.name}</strong></div></div><div class="timeline"><span class="timeline-step done"><i></i>Created</span><span class="timeline-step done"><i></i>Provider request</span><span class="timeline-step done"><i></i>Provider processing</span><span class="timeline-step done"><i></i>Webhook received</span><span class="timeline-step done"><i></i>Verification</span><span class="timeline-step ${t.status==='Successful'?'done':''}"><i></i>${t.status}</span></div><div class="modal-actions"><button class="secondary" onclick="showToast('Transaction export started')">${I.download} Export</button><button class="warning" onclick="openAction('${t.id}','Refund transaction')">Refund</button><button class="danger" onclick="openAction('${t.id}','Reverse transaction')">Reverse</button></div></div>`}
    function actionModal(a){const isSuspend=a.label.includes('Suspend'),isFreeze=a.label.includes('Freeze'),isRestrict=a.label.includes('Restrict');return `<div class="modal-head"><h2>${a.label}</h2><button class="icon" onclick="closeModal()">${I.close}</button></div><div class="modal-body">${isSuspend||isFreeze||isRestrict?`<div class="notice ${isSuspend||isFreeze?'warning':''}">${isFreeze?I.lock:I.alert}<span>This action requires the authenticated admin backend and will be audited before affecting an account or wallet.</span></div>`:''}<div class="form-grid"><div class="field full"><label>Reason</label><select id="action-reason"><option>Suspicious activity</option><option>Security concern</option><option>Failed verification</option><option>Policy violation</option><option>User request</option><option>Other</option></select></div><div class="field full"><label>Additional note</label><textarea id="action-note" placeholder="Add an internal operational note"></textarea></div>${isSuspend?`<div class="field"><label>Duration</label><select><option>Indefinite</option><option>Until date</option></select></div>`:''}${isRestrict?`<div class="field full"><label>Restrictions</label><select multiple style="height:84px"><option>Cannot send money</option><option>Cannot receive money</option><option>Cannot withdraw</option><option>Cannot deposit</option><option>Cannot create payment links</option></select></div>`:''}</div><div class="form-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="${isSuspend||isFreeze?'danger':'primary'}" onclick="confirmAction('${a.target}','${a.label}')">${a.label}</button></div></div>`}
    function adjustmentModal(){return `<div class="modal-head"><h2>Confirm financial adjustment</h2><button class="icon" onclick="closeModal()">${I.close}</button></div><div class="modal-body"><div class="notice warning">${I.alert}<span>This operation creates a new audited financial event through the authenticated backend.</span></div><div class="empty">${I.database}<h3>Backend confirmation required</h3><p>No sample balances or references are shown.</p></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="applyAdjustment()">${I.check} Confirm adjustment</button></div></div>`}
    function modal(){if(!state.modal)return '';let body='';if(state.modal.type==='user')body=userModal(state.modal.data);if(state.modal.type==='tx')body=txModal(state.modal.data);if(state.modal.type==='action')body=actionModal(state.modal);if(state.modal.type==='adjustment')body=adjustmentModal();return `<div class="modal-backdrop open" id="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`}
     function legacyPage(){switch(state.view){case'overview':return overview();case'users':return usersPage();case'wallets':return walletsPage();case'transactions':return transactionTable('Transactions','Review every money movement across the platform.');case'deposits':return depositsPage();case'withdrawals':return withdrawalsPage();case'transfers':return transfersPage();case'adjustments':return adjustments();case'bonus-recipients':return bonusRecipientsPage();case'risk':return risk();case'frozen':return frozenPage();case'suspended':return suspendedPage();case'provider':return provider();case'health':return health();case'notifications':return notificationsPage();case'sessions':return sessions();case'admin-profile':return adminProfile();case'permissions':return permissions();case'settings':return adminSettings();case'payment-links':case'merchants':case'ledger':case'reconciliation':case'webhooks':case'audit':case'cases':return genericTable(state.view);case'limits':return limitsPage();case'fees':return feesPage();case'security-events':return securityEventsPage();case'jobs':return jobsPage();case'notes':return notesPage();default:return overview()}}

      function liveWithdrawalsPage(){const rows=Array.isArray(state.liveTables.withdrawals)?state.liveTables.withdrawals:[];const formatStatus=value=>String(value||'pending').replace(/^./,m=>m.toUpperCase());const filtered=rows.filter(r=>{const q=state.query.toLowerCase();const status=formatStatus(r.status);return(!q||[r.user_name,r.user_reference,r.user_id,r.destination,r.provider_reference].join(' ').toLowerCase().includes(q))&&(state.txFilter==='All statuses'||state.txFilter==='All'||status===state.txFilter)});return `<section class="view">${heading('Withdrawals','Review outgoing requests and return reserved funds safely before provider processing.',`<button class="secondary" onclick="loadLiveAdminData(window.zedmoneyAdmin.api)">${I.refresh} Refresh</button>`)}<div class="notice">${I.shield}<span>Approve sends a pending withdrawal to Lipila immediately. Decline is available before provider processing and returns the reserved funds with an immutable ledger release and an admin audit record.</span></div><div class="card table-card spacer"><div class="toolbar"><div class="search">${I.search}<input placeholder="Search withdrawals" value="${state.query}" oninput="state.query=this.value;state.page=1;render()"></div><div class="filter-group"><select class="filter" onchange="state.txFilter=this.value;state.page=1;render()"><option>All statuses</option><option>Pending</option><option>Processing</option><option>Successful</option><option>Failed</option><option>Cancelled</option></select><button class="secondary" onclick="exportCSV()">${I.download} Export</button></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>User</th><th>Amount</th><th>Fee</th><th>Destination</th><th>Status</th><th>Provider reference</th><th>Action</th></tr></thead><tbody>${filtered.map(r=>{const status=formatStatus(r.status),canAct=status==='Pending'&&!r.provider_reference;return `<tr><td>${r.created_at?new Date(r.created_at).toLocaleString():'—'}</td><td><b>${r.user_name||'Unknown        const originalPage=legacyPage; function page(){return state.view==='bonus-recipients'?bonusRecipientsPage():state.view==='fees'?feesPage():state.view==='withdrawals'&&(state.liveTables.withdrawals!==undefined||state.liveErrors.withdrawals)?liveWithdrawalsPage():state.liveTables[state.view]!==undefined?liveGenericTable(state.view,state.liveTables[state.view]):originalPage()}

    function replaceWithLiveUsers(rows){
      if(!Array.isArray(rows)||!rows.length)return;
      users=rows.map((p,i)=>({
        id:p.id, displayId:p.zedmoney_id||p.id, name:p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||p.email||p.id,
        phone:p.phone||'—', email:p.email||'—', wallet:p.wallet_identifier||'—', balance:Number(p.available_balance||0), walletStatus:(p.wallet_status||'').replace(/^./,m=>m.toUpperCase()),
        status:(p.status||'active').replace(/^./,m=>m.toUpperCase()), verification:(p.verification_status||'unverified').replace(/^./,m=>m.toUpperCase()),
        last:p.updated_at?new Date(p.updated_at).toLocaleString():'—', created:p.created_at?new Date(p.created_at).toLocaleDateString():'—'
      }));
    }
    function replaceWithLiveTransactions(rows){
      if(!Array.isArray(rows)||!rows.length)return;
      const byId=new Map(users.map(u=>[u.id,u]));
      transactions=rows.map(t=>({
        id:t.id, user:byId.get(t.user_id)||{id:t.user_id,name:'Unknown user',displayId:t.user_id,wallet:'—'},
        type:String(t.type||'transaction').replace(/^./,m=>m.toUpperCase()), amount:Number(t.amount||0), fee:Number(t.fee||0),
         status:String(t.status||'pending').replace(/^./,m=>m.toUpperCase()), provider:t.provider||'—', method:t.method||t.metadata?.method||'Mobile money',
         date:t.created_at?new Date(t.created_at).toLocaleString():'—', providerRef:t.provider_reference||'—',
         providerMessage:t.metadata?.provider_message||'—', metadata:t.metadata||{}
      }));
      deposits=transactions.filter(t=>t.type==='Deposit'); withdrawals=transactions.filter(t=>t.type==='Withdrawal'); transfers=transactions.filter(t=>t.type==='Transfer');
    }
       async function loadLiveAdminData(api){
         const paths=['users?limit=100','transactions','overview','audit','wallets','deposits','withdrawals','transfers','payment-links','reconciliation','webhooks','security-events','sessions','notifications','risk','ledger','limits','fees','bonus-settings','bonus-recipients','withdrawal-settings'];
       const results=await Promise.allSettled(paths.map(path=>api('/api/admin/'+path)));
       const [userResult,txResult,overviewResult,auditResult]=results;
      if(userResult.status==='fulfilled')replaceWithLiveUsers(userResult.value);
      if(txResult.status==='fulfilled')replaceWithLiveTransactions(txResult.value);
       if(auditResult.status==='fulfilled'&&Array.isArray(auditResult.value))state.audit=auditResult.value.map(a=>({time:a.created_at?new Date(a.created_at).toLocaleString():'—',action:a.action||'—',target:a.target_id||'—',ref:a.id||'—',reason:a.reason||'—'}));
       paths.slice(4).forEach((path,i)=>{
         const r=results[i+4];
          if(['bonus-settings','bonus-recipients','withdrawal-settings'].includes(path))return;
         const key=path.split('?')[0];
         if(r.status==='fulfilled'){
           state.liveTables[key]=r.value;
           delete state.liveErrors[key];
         }else state.liveErrors[key]=r.reason?.message||'The authenticated admin API did not return this data.';
       });
       if(overviewResult.status==='fulfilled')state.remoteOverview=overviewResult.value;
       const bonusResult=results[paths.indexOf('bonus-settings')]; if(bonusResult?.status==='fulfilled')state.bonusSettings=bonusResult.value;
       const recipientsResult=results[paths.indexOf('bonus-recipients')]; if(recipientsResult?.status==='fulfilled')state.bonusRecipients=recipientsResult.value;
       const withdrawalSettingsResult=results[paths.indexOf('withdrawal-settings')]; if(withdrawalSettingsResult?.status==='fulfilled')state.withdrawalSettings=withdrawalSettingsResult.value;
      render();
      const loaded=results.filter(r=>r.status==='fulfilled').length;
       showToast(`Live admin data loaded (${loaded}/${paths.length} endpoints)`);
    }

     function showToast(message){const e=document.createElement('div');e.className='toast';e.innerHTML=`${I.check}<span>${message}</span>`;document.getElementById('toasts').appendChild(e);setTimeout(()=>e.remove(),3200)}
     function exportCSV(){const rows=state.view==='users'?users:state.view==='transactions'?transactions:(state.liveTables[state.view]||[]);if(!rows.length)return showToast('No live records to export');const keys=Object.keys(rows[0]);const csv=[keys.join(','),...rows.map(row=>keys.map(k=>`"${String(row[k]??'').replaceAll('"','""')}"`).join(','))].join('\\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`zedmoney-${state.view}-export.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);showToast('Live CSV export started')}
    function openSearch(){document.querySelector('.global-search input')?.focus()}function globalSearch(value){state.query=value;if(value.length>2&&value.toLowerCase().includes('zm-'))showToast('Search results available in Users and Wallets')}function toggleMaintenance(){showConfirm('Enable maintenance mode?','This setting requires authenticated backend authorization.','Enable maintenance',"state.maintenance=true;render();showToast('Maintenance mode enabled')")}
    document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();openSearch()}if(e.key==='Escape'){state.drawer=false;state.modal=null;document.querySelectorAll('.modal-backdrop').forEach(x=>x.remove());render()}})
    window.addEventListener('popstate',()=>{state.view=location.hash.slice(1)||'overview';render()});state.view=location.hash.slice(1)||'overview';render();document.getElementById('loading').classList.add('hide');setInterval(()=>{if(state.view==='overview'&&!state.modal){const feed=document.querySelector('.live-list');if(feed){const first=feed.firstElementChild;if(first){first.classList.add('new');setTimeout(()=>first.classList.remove('new'),1000)}}}},9000)
  </script>
  <script>
    (() => {
      const gate=document.getElementById('admin-auth'), form=document.getElementById('admin-login'), error=document.getElementById('admin-error'), button=document.getElementById('admin-submit');
       const apiBaseUrl=(document.querySelector('meta[name="zedmoney:api-base-url"]')?.content||'').trim().replace(/\/+$/,'');
       const api=async(path,options={})=>{
         if(!apiBaseUrl) throw new Error('The API base URL is missing from this page.');
         let r;
         try {
           r=await fetch(`${apiBaseUrl}${path}`,{
             credentials:'include',
             headers:{'Content-Type':'application/json',...(options.headers||{})},
             ...options
           });
         } catch {
           throw new Error(`Could not reach the API at ${apiBaseUrl}. Check the API service and browser CORS settings.`);
         }
         const body=await r.json().catch(()=>({}));
          if(!r.ok) {
            const detail=body.error?.message||body.message||`API request failed (${r.status}).`;
            throw new Error(`${detail} [HTTP ${r.status}]`);
          }
         return body.data;
       };
       const unlock=async()=>{
         gate.remove();
         document.body.classList.add('admin-ready');
         // Keep the spinner visible while waking a sleeping Render API and
         // attempting to load live data. Supabase remains required for admin
         // authentication and live database access.
         document.getElementById('loading')?.classList.remove('hide');
         try { await loadLiveAdminData(api); } finally { document.getElementById('loading')?.classList.add('hide'); }
       };
      api('/api/admin/session').then(unlock).catch(()=>{});
      form.onsubmit=async e=>{e.preventDefault();error.textContent='';button.disabled=true;button.classList.add('is-loading');button.innerHTML='<span class="button-spinner" aria-hidden="true"></span> Signing in…';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('admin-password').value})});await unlock();}catch(err){error.textContent=err.message;}finally{button.disabled=false;button.classList.remove('is-loading');button.textContent='Sign in';}};
      window.zedmoneyAdmin={api,loadLiveAdminData,logout:async()=>{await api('/api/admin/logout',{method:'POST'});location.reload();}};
    })();
  </script>
</body>
