<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091f32">
  <meta name="zedmoney:supabase-url" content="https://ogbllqeppeldaqfntwca.supabase.co">
  <meta name="zedmoney:supabase-anon-key" content="sb_publishable_s9niKjtssyGDFvN3dvDD9A_pSrnrxig">
  <meta name="zedmoney:api-base-url" content="https://zeedmoney-server.onrender.com">
  <title>Sign in — ZedMoney</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--navy:#071e31;--navy2:#0a3150;--teal:#79c4ca;--ink:#132633;--muted:#637582;--line:#dce6ea;--page:#f4f7f8;--red:#b74d4d;--green:#247e61;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--page);color:var(--ink)}button,input{font:inherit}button{cursor:pointer;border:0}
    .layout{min-height:100vh;display:grid;grid-template-columns:minmax(300px,.85fr) minmax(420px,1.15fr)}.aside{background:var(--navy);color:#d9e7ed;padding:clamp(28px,6vw,80px);display:flex;flex-direction:column;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;color:#fff;font-size:20px;font-weight:700;text-decoration:none;letter-spacing:-.4px}.logo{width:38px;height:31px}.aside-copy{max-width:390px}.eyebrow{color:var(--teal);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700}.aside h1{font-size:clamp(32px,4vw,54px);line-height:1.06;letter-spacing:-1.8px;font-weight:650;margin:18px 0}.aside p{color:#a9bfca;line-height:1.7;font-size:14px}.aside-foot{font-size:11px;color:#89a3af}.main{display:grid;place-items:center;padding:35px 22px}.panel{width:min(460px,100%)}.panel-head{margin-bottom:28px}.panel h2{font-size:28px;letter-spacing:-.8px;margin:0 0 8px}.panel-intro{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:25px}.tab{background:none;color:#82939c;padding:0 0 12px;font-weight:650;font-size:13px;border-bottom:2px solid transparent}.tab.active{color:var(--navy2);border-color:var(--teal)}.form{display:grid;gap:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700;color:#405966}.field input{width:100%;min-height:45px;border:1px solid #cbd9de;border-radius:7px;padding:0 12px;color:var(--ink);background:#fff}.field input:focus{outline:0;border-color:#6faeb9;box-shadow:0 0 0 3px #dff0f1}.password{position:relative}.password input{padding-right:68px}.show{position:absolute;right:9px;top:8px;height:29px;background:none;color:var(--navy2);font-size:11px;font-weight:700}.form-meta{display:flex;justify-content:flex-end}.link{background:none;color:var(--navy2);font-size:12px;font-weight:700;padding:0}.primary{min-height:46px;border-radius:7px;background:var(--navy2);color:#fff;font-weight:700;margin-top:3px}.primary:hover{background:#155a80}.primary:disabled{opacity:.6;cursor:wait}.message{min-height:20px;font-size:12px;line-height:1.45}.message.error{color:var(--red)}.message.success{color:var(--green)}.legal{color:#87979f;font-size:11px;line-height:1.5;margin:3px 0 0}.hidden{display:none!important}.loader{display:inline-block;width:14px;height:14px;border:2px dotted currentColor;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.layout{display:block}.aside{min-height:220px;padding:25px 22px 30px}.aside-copy{display:none}.aside-foot{margin-top:45px}.main{padding:34px 20px 45px}.panel h2{font-size:25px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="aside">
      <a class="brand" href="index.html"><svg class="logo" viewBox="0 0 40 32" aria-hidden="true" fill="currentColor"><path d="M6 4h28v6H18l16 11v7H6v-6h16L6 10V4Z"/></svg>ZedMoney</a>
      <div class="aside-copy"><span class="eyebrow">Digital wallet</span><h1>Simple control for everyday money.</h1><p>Manage your balance, payments and wallet activity from one clear workspace.</p></div>
      <div class="aside-foot">ZedMoney · Personal wallet</div>
    </aside>
    <main class="main">
      <section class="panel" aria-live="polite">
        <div class="panel-head"><h2 id="title">Welcome back</h2><p class="panel-intro" id="intro">Sign in to continue to your wallet.</p></div>
        <div class="tabs"><button class="tab active" id="signin-tab" type="button">Sign in</button><button class="tab" id="signup-tab" type="button">Create account</button></div>
        <form class="form" id="form" novalidate>
          <div class="field signup-only hidden"><label for="full-name">Full name</label><input id="full-name" autocomplete="name" maxlength="160" required></div>
          <div class="field signup-only hidden"><label for="username">Username</label><input id="username" autocomplete="username" maxlength="30" minlength="3" pattern="[A-Za-z0-9_]+" required></div>
          <div class="field signup-only hidden"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+260 97 000 0000" maxlength="20" required></div>
          <div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div>
          <div class="field password"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button class="show" type="button" data-for="password">Show</button></div>
          <div class="field password signup-only hidden"><label for="confirm">Confirm PIN</label><input id="confirm" type="password" inputmode="numeric" autocomplete="new-password" minlength="6" maxlength="6"><button class="show" type="button" data-for="confirm">Show</button></div>
          <div class="form-meta"><button class="link" id="forgot" type="button">Forgot password?</button></div>
          <div class="message" id="message"></div><button class="primary" id="submit" type="submit">Sign in</button>
          <p class="legal">By continuing, you agree to use ZedMoney for your own account and activity.</p>
        </form>
      </section>
    </main>
  </div>
  <script>
    (() => {
      const meta = n => document.querySelector(`meta[name="${n}"]`)?.content.trim();
       const url = meta('zedmoney:supabase-url'), anon = meta('zedmoney:supabase-anon-key'), apiBaseUrl = meta('zedmoney:api-base-url') || '';
      const client = url && anon && window.supabase ? window.supabase.createClient(url, anon) : null;
      const $ = id => document.getElementById(id), form=$('form'), submit=$('submit'), msg=$('message');
      let mode = 'signin', busy = false;
       const SESSION_TTL = 24 * 60 * 60 * 1000, sessionStartedKey = 'zedmoney:session-start';
      const returnTo = (() => { const value = new URLSearchParams(location.search).get('returnTo') || sessionStorage.getItem('zedmoney:return-to') || 'index.html'; return /^(index\.html)(#[a-z-]+)?$/.test(value) ? value : 'index.html'; })();
      const message = (text, kind='error') => { msg.textContent=text; msg.className=`message ${kind}`; };
       const friendlyAuthError = error => { const text=String(error?.message||'').toLowerCase(); if(text.includes('invalid login')||text.includes('invalid email or password')) return 'That email address or PIN is not correct.'; if(text.includes('already registered')||text.includes('already been registered')) return 'An account with this email already exists. Try signing in instead.'; if(text.includes('password should be at least')) return 'Choose a PIN with 6 digits.'; if(text.includes('email not confirmed')) return 'Please confirm your email address before signing in.'; if(text.includes('rate limit')) return 'Too many attempts. Please wait a moment and try again.'; if(text.includes('username')) return 'That username is already in use. Try another one.'; return 'We could not complete that wallet request. Please try again.'; };
       const setMode = next => { mode=next; const signup=mode==='signup', reset=mode==='reset'; document.querySelectorAll('.signup-only').forEach(el=>el.classList.toggle('hidden',!signup)); ['full-name','username','phone'].forEach(id=>$(id).required=signup); $('confirm').required=signup||reset; $('confirm').parentElement.classList.toggle('hidden',!(signup||reset)); $('signin-tab').classList.toggle('active',!signup&&!reset); $('signup-tab').classList.toggle('active',signup); $('title').textContent=signup?'Create your account':reset?'Choose a new password':'Welcome back'; $('intro').textContent=signup?'Set up your ZedMoney wallet.':reset?'Enter a new password for your account.':'Sign in to continue to your wallet.'; submit.textContent=signup?'Create account':reset?'Update password':'Sign in'; $('forgot').classList.toggle('hidden',signup||reset); $('password').autocomplete=signup||reset?'new-password':'current-password'; $('password').inputMode=signup?'numeric':''; $('password').minLength=signup?'6':'8'; $('password').maxLength=signup?'6':''; $('password').placeholder=signup?'6-digit PIN':'Password'; message('',''); };
      const redirect = () => { sessionStorage.removeItem('zedmoney:return-to'); location.replace(returnTo); };
      $('signin-tab').onclick=()=>setMode('signin'); $('signup-tab').onclick=()=>setMode('signup');
      document.querySelectorAll('.show').forEach(button=>button.onclick=()=>{const input=$(button.dataset.for); input.type=input.type==='password'?'text':'password'; button.textContent=input.type==='password'?'Show':'Hide';});
       $('forgot').onclick=async()=>{ if(!client)return message('Wallet sign-in is temporarily unavailable. Please try again later.'); const email=$('email').value.trim(); if(!email)return message('Enter the email linked to your wallet first.'); busy=true; submit.disabled=true; try { const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:`${location.origin}${location.pathname}`}); if(error)throw error; message('We sent a password reset link to your email.','success'); } catch(e){message(friendlyAuthError(e));} finally {busy=false;submit.disabled=false;} };
       const api = async (path, options={}) => { const session=(await client.auth.getSession()).data.session; if(!session) throw new Error('Your session has expired. Please sign in again.'); const response=await fetch(`${apiBaseUrl}${path}`,{...options,headers:{'Content-Type':'application/json',...(options.headers||{}),Authorization:`Bearer ${session.access_token}`}}); const body=await response.json().catch(()=>({})); if(response.status===401) { await client.auth.signOut(); throw new Error('Your session has expired. Please sign in again.'); } if(!response.ok||body.success===false) throw new Error(body.error?.message||'Unable to save your profile.'); return body.data; };
       const validPhone = value => /^\+?[1-9]\d{7,14}$/.test(value.replace(/[()\s-]/g,''));
       const validUsername = value => /^[A-Za-z0-9_]{3,30}$/.test(value);
       form.onsubmit=async e=>{e.preventDefault();if(busy)return;if(!client)return message('Wallet sign-in is temporarily unavailable. Please try again later.'); const email=$('email').value.trim(), password=$('password').value; if(mode!=='reset'&&(!email||!email.includes('@')))return message('Enter a valid email address.'); if(mode==='signup'){const fullName=$('full-name').value.trim(), username=$('username').value.trim(), phone=$('phone').value.trim(); if(fullName.split(/\s+/).length<2)return message('Enter your first and last name.'); if(!validUsername(username))return message('Username must be 3–30 letters, numbers, or underscores.'); if(!validPhone(phone))return message('Enter a valid phone number with country code.'); if(!/^\d{6}$/.test(password))return message('Your PIN must be exactly 6 digits.');} else if(password.length<8)return message('Your password must be at least 8 characters.'); if((mode==='signup'||mode==='reset')&&password!==$('confirm').value)return message(mode==='signup'?'Your PINs do not match.':'Your passwords do not match.'); busy=true;submit.disabled=true;submit.innerHTML='<span class="loader"></span>'; try { let result; if(mode==='signup'){const parts=$('full-name').value.trim().split(/\s+/), fullName=$('full-name').value.trim(), username=$('username').value.trim(), phone=$('phone').value.trim(); result=await client.auth.signUp({email,password,options:{data:{full_name:fullName,username,first_name:parts[0],last_name:parts.slice(1).join(' '),phone}}});}else if(mode==='reset'){result=await client.auth.updateUser({password});}else{result=await client.auth.signInWithPassword({email,password});} if(result.error)throw result.error; if(mode==='signup'&&!result.data.session){message('Your account is ready. Check your email to confirm it before signing in.','success');return;} if(mode==='reset'){message('Your wallet password was updated. Sign in again.','success');setMode('signin');return;} if(result.data.session){localStorage.setItem(sessionStartedKey,String(Date.now()));} if(mode==='signup'){const fullName=$('full-name').value.trim(), parts=fullName.split(/\s+/); await api('/api/me/profile',{method:'PATCH',body:JSON.stringify({first_name:parts[0],last_name:parts.slice(1).join(' '),display_name:fullName,username:$('username').value.trim(),phone:$('phone').value.trim()})});} redirect(); }catch(e){message(friendlyAuthError(e));}finally{busy=false;submit.disabled=false;submit.textContent=mode==='signup'?'Create account':mode==='reset'?'Update password':'Sign in';} };
       const boot=async()=>{if(!client)return message('Wallet sign-in is temporarily unavailable. Please try again later.'); const {data}=await client.auth.getSession(); if(data.session&&!location.hash.includes('type=recovery')){const started=Number(localStorage.getItem(sessionStartedKey)||0); if(started&&Date.now()-started>=SESSION_TTL){await client.auth.signOut();return;} if(!started)localStorage.setItem(sessionStartedKey,String(Date.now())); redirect();} if(location.hash.includes('type=recovery')){setMode('reset');message('Choose a new password for your account.','success');}};
      boot();
    })();
  </script>
</body>
</html>
