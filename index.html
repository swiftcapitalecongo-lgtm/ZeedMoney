    const logoPath = '<path d="M6 4h28v6H18l16 11v7H6v-6h16L6 10V4Z"/>';

    logoObserver.observe(document.body,{childList:true,subtree:true});
     const navGroups = [
       ['MAIN',[['dashboard','Home','grid'],['wallet','Wallet','wallet'],['send','Send money','send'],['receive','Receive','receive']]],
       ['PAYMENTS',[['bills','Pay bills','bill'],['airtime','Airtime','phone'],['qr','QR payments','qr']]],
       ['ACTIVITY',[['transactions','Transactions','clock'],['statements','Statements','download'],['alerts','Notifications','bell']]],
       ['ACCOUNT',[['security','Security','shield'],['settings','Settings','settings']]],
       ['MORE',[['add','Add money','plus'],['withdraw','Withdraw','withdraw'],['beneficiaries','Recipients','user'],['requests','Requests','receive'],['links','Payment links','link'],['limits','Wallet limits','shield'],['analytics','Analytics','grid'],['profile','Profile','user'],['help','Help center','help'],['referral','Invite friends','share'],['merchant','Merchant mode','bank']]]
     ];
     const navItems = navGroups.flatMap(group => group[1]);
    let transactions = [];
      let state = {view:'dashboard', previous:'dashboard', balanceVisible:true, selectedTx:null, drawer:false, notifications:false, profile:false, linkFilter:'All', txSearch:'', txType:'All', txStatus:'All', paymentMethod:'mobile', flow:null, page:1, analyticsRange:'30 days', billType:'Electricity', notificationFilter:'All', notificationRead:false, currency:'ZMW', walletFrozen:false, recipients:[], requests:[], links:[], depositBusy:false};
     const currencyCode = () => window.zedmoneyProfile?.wallet?.currency || window.zedmoneyProfile?.profile?.currency || state.currency || 'ZMW';
     const money = n => `${n < 0 ? '- ' : ''}${currencyCode()} ${Math.abs(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
     const positiveMoney = n => `${currencyCode()} ${Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
    const logoBrand = (dark=false) => `<a class="brand" href="#" onclick="navigate('dashboard');return false;">${logo}<strong>ZedMoney</strong></a>`;
    const badge = s => `<span class="badge ${s==='Completed'?'success':s==='Pending'?'pending':s==='Failed'?'failed':'neutral'}">${s}</span>`;
    const transactionIcon = tx => `<span class="tx-icon ${tx.type==='in'?'in':tx.type==='failed'?'failed':'out'}">${icons[tx.type==='in'?'receive':tx.type==='failed'?'close':'send']}</span>`;
     const currentProfile = () => window.zedmoneyProfile?.profile || {};
     const currentWallet = () => window.zedmoneyProfile?.wallet || {};
     const displayName = () => { const p=currentProfile(); return p.display_name || [p.first_name,p.last_name].filter(Boolean).join(' ') || p.username || 'there'; };
     const profileInitials = () => displayName().trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase() || 'U';
     const walletAmount = key => Number(currentWallet()[key] || 0);
     const liveStatus = () => currentWallet().status || currentProfile().status || 'active';
     const liveCurrency = () => currentWallet().currency || currentProfile().currency || state.currency || 'ZMW';
     const formatDate = value => { if(!value)return ''; const d=new Date(value); return Number.isNaN(d.getTime())?String(value):d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}); };
     function renderNav() { return navGroups.map(([label,items])=>`<div class="nav-group"><div class="nav-label">${label}</div>${items.map(([id,text,icon])=>`<button class="nav-link ${state.view===id?'active':''}" onclick="navigate('${id}')">${icons[icon]}<span>${text}</span></button>`).join('')}</div>`).join(''); }
     function appFrame(content) {
      const topTitle = state.view==='dashboard' ? 'Dashboard' : (navItems.find(n=>n[0]===state.view)?.[1] || 'ZedMoney');
       const unreadCount=(window.zedmoneyNotifications||[]).filter(n=>!n.read_at&&!n.read).length;
         return `<div class="app-shell"><aside class="sidebar">${logoBrand()}${renderNav()}<div class="sidebar-spacer"></div><div class="sidebar-foot"><b>ZedMoney</b>Secure digital wallet<br><span>Personal wallet</span></div></aside><main class="main"><header class="topbar"><div class="topbar-left"><button class="mobile-menu icon-btn" aria-label="Open menu" onclick="toggleDrawer(true)">${icons.menu}</button>${state.view!=='dashboard'?`<button class="icon-btn" aria-label="Back" onclick="goBack()">${icons.back}</button>`:''}<div><div class="page-kicker">ZedMoney workspace</div><h2 class="page-title">${topTitle}</h2></div></div><div class="topbar-actions"><button class="icon-btn" aria-label="Notifications" onclick="navigate('alerts')">${icons.bell}${unreadCount?`<i class="notification-dot">${Math.min(9,unreadCount)}</i>`:''}</button><div class="profile-wrap"><button class="avatar" aria-label="Open profile menu" onclick="toggleProfile()">${profileInitials()}</button><div class="profile-menu ${state.profile?'open':''}" id="profile-menu"><button onclick="navigate('profile');toggleProfile()">Profile</button><button onclick="navigate('security');toggleProfile()">Security</button><button onclick="navigate('settings');toggleProfile()">Settings</button><button onclick="window.zedmoneyAuth?.signOut?.()">Log out</button></div></div></div></header><div class="content">${content}</div></main>${bottomNav()}</div>${drawerMarkup()}${modalMarkup()}`;
    }
     function bottomNav() { return `<nav class="bottom-nav">${[['dashboard','Home','grid'],['wallet','Wallet','wallet'],['send','Send','send'],['transactions','Activity','clock'],['menu','More','more']].map(([id,label,icon])=>`<button class="${state.view===id?'active':''}" onclick="${id==='menu'?'toggleDrawer(true)':`navigate('${id}')`}">${icons[icon]}<span>${label}</span></button>`).join('')}</nav>`; }

     function notificationsPanel(){const notes=window.zedmoneyNotifications||[];const category=n=>{const type=String(n.type||'').toLowerCase();if(/security|login|pin|device|password/.test(type))return'Security';if(/payment|bonus|request|link/.test(type))return'Payments';return'Transactions';};const filtered=notes.filter(n=>state.notificationFilter==='All'||category(n)===state.notificationFilter);return `<div class="notification-panel ${state.notifications?'open':''}" role="dialog" aria-label="Notifications"><div class="notification-head"><div><h2>Notifications</h2><span class="small muted">${notes.length} notification${notes.length===1?'':'s'}</span></div><button class="text-btn" onclick="markAllNotificationsRead()">Mark all read</button></div><div class="segmented">${['All','Transactions','Payments','Security'].map(x=>`<button class="segment ${state.notificationFilter===x?'active':''}" onclick="state.notificationFilter='${x}';render()">${x}</button>`).join('')}</div>${filtered.map(n=>`<div class="notification"><span class="notification-icon">${icons.bell}</span><div><strong>${n.title}</strong><p>${n.message}</p>${n.type==='welcome_bonus'?'<button class="text-btn" onclick="navigate(\'add\')">Add funds</button>':''}<time>${formatDate(n.created_at)}</time></div></div>`).join('')||'<p class="helper spacer-top">No notifications in this category.</p>'}</div>`;}
     function dashboard(){const w=currentWallet(),a=window.zedmoneyProfile?.analytics||{},cur=liveCurrency(),available=walletAmount('available_balance'),recent=transactions.slice(0,5).map(txRow).join('');const recentHtml=recent||'<div class="empty"><h3>No transactions yet</h3><p>Your real wallet activity will appear here.</p></div>';return `<section class="view"><div class="welcome"><div><h1>Good morning, ${displayName().split(/\s+/)[0]}</h1><p class="subtitle">Here’s what’s happening with your wallet today.</p></div><button class="primary-btn" onclick="navigate('add')">${icons.plus} Add money</button></div><div class="dashboard-grid"><div class="balance-card card"><div class="balance-head"><span>Available balance</span><span class="status"><i class="status-dot"></i> ${w.status||'Active'}</span></div><div class="balance-value-row"><strong class="balance-value">${state.balanceVisible ? cur+' '+available.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '••••••••'}</strong><span class="currency">${cur}</span><button class="icon-btn" aria-label="Toggle balance visibility" onclick="toggleBalance()">${state.balanceVisible?icons.eye:icons.eyeOff}</button></div><div class="balance-foot"><span>Updated just now</span><span>${displayName()}</span></div></div><div class="card quick-card"><div class="section-heading"><h2>Quick actions</h2><span class="small muted">${liveStatus()}</span></div><div class="action-grid">${[['add','Add money','plus'],['send','Send','send'],['withdraw','Withdraw','withdraw'],['receive','Receive','receive']].map(a=>action(a)).join('')}</div></div></div><div class="stats-row"><div class="card stat-card"><div class="stat-label">Received</div><div class="stat-value">${cur} ${Number(a.total_received||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div><div class="card stat-card"><div class="stat-label">Sent</div><div class="stat-value">${cur} ${Number(a.total_sent||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div><div class="card stat-card"><div class="stat-label">Wallet status</div><div class="stat-value">${w.status||'Active'}</div></div></div><div class="card transactions-card"><div class="section-heading"><h2>Recent transactions</h2><button class="text-btn" onclick="navigate('transactions')">View all</button></div>${recentHtml}</div></section>`;}
    function action(a) { const click=a[0]==='more'?'openActionSheet()':(a[0]==='pay'||a[0]==='bills'?'navigate(\'bills\')':`navigate('${a[0]}')`); return `<button class="action" onclick="${click}"><span class="action-icon">${icons[a[2]]}</span><span>${a[1]}</span></button>`; }
    function txRow(tx) { return `<button class="transaction" onclick="openTransaction('${tx.id}')">${transactionIcon(tx)}<span class="tx-info"><span class="transaction-title">${tx.title}</span><span class="transaction-sub">${tx.sub}</span></span><span class="tx-side"><span class="tx-amount ${tx.type==='in'?'in':''}">${money(tx.amount)}</span><span class="tx-meta">${tx.date}</span></span></button>`; }
    function pageIntro(title,desc,actionHtml='') { return `<div class="page-intro"><div><button class="back-btn" onclick="goBack()">${icons.back} Back</button><h1>${title}</h1><p class="subtitle">${desc}</p></div>${actionHtml?`<div class="page-actions">${actionHtml}</div>`:''}</div>`; }
     function wallet(){const w=currentWallet(),a=window.zedmoneyProfile?.analytics||{},cur=liveCurrency(),net=Number(a.total_received||0)-Number(a.total_sent||0);return `<section class="view">${pageIntro('Wallet overview','A clear view of what’s available, moving and reserved.') }<div class="balance-overview"><div class="card overview-cell featured"><div class="stat-label">Available balance</div><div class="stat-value">${cur} ${walletAmount('available_balance').toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-detail">Ready to use</div></div><div class="card overview-cell"><div class="stat-label">Pending balance</div><div class="stat-value">${cur} ${walletAmount('pending_balance').toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-detail">Pending funds</div></div><div class="card overview-cell"><div class="stat-label">Reserved balance</div><div class="stat-value">${cur} ${walletAmount('reserved_balance').toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-detail">Reserved funds</div></div></div><div class="stats-row"><div class="card stat-card"><div class="stat-label">Total received</div><div class="stat-value">${cur} ${Number(a.total_received||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-detail">${a.successful_transactions||0} successful transactions</div></div><div class="card stat-card"><div class="stat-label">Total sent</div><div class="stat-value">${cur} ${Number(a.total_sent||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-detail">${a.transaction_count||0} transactions</div></div><div class="card stat-card"><div class="stat-label">Net movement</div><div class="stat-value">${net>=0?'+ ':'- '}${cur} ${Math.abs(net).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-detail">Based on recorded transactions</div></div></div><div class="card chart-card"><div class="chart-header"><div><h2>Money activity</h2><p class="subtitle">Incoming and outgoing activity from your account.</p></div></div>${lineChart()}</div></section>`;}
    function lineChart() { return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 800 230" preserveAspectRatio="none" aria-label="Money activity chart"><path d="M0 178 C40 150 55 178 92 153 S155 140 190 158 S247 128 283 142 S348 105 380 125 S442 93 478 120 S525 97 565 105 S622 75 660 92 S720 47 800 63" fill="none" stroke="#155a80" stroke-width="3"/><path d="M0 194 C48 201 61 178 95 188 S150 172 190 190 S244 155 283 177 S337 162 380 173 S440 141 478 158 S530 154 565 145 S615 123 660 139 S720 118 800 124" fill="none" stroke="#79c4ca" stroke-width="2"/><path d="M0 178 C40 150 55 178 92 153 S155 140 190 158 S247 128 283 142 S348 105 380 125 S442 93 478 120 S525 97 565 105 S622 75 660 92 S720 47 800 63 L800 230 L0 230Z" fill="url(#area)" opacity=".08"/><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#155a80"/><stop offset="1" stop-color="#fff"/></linearGradient></defs></svg></div><div class="chart-labels"><span>1 Aug</span><span>8 Aug</span><span>15 Aug</span><span>22 Aug</span><span>Today</span></div>`; }
    function send(){const cur=liveCurrency(),avail=walletAmount('available_balance');const recs=state.recipients.map(r=>{const initials=(r.name||'R').slice(0,2).toUpperCase();return `<button class="recipient" onclick="selectRecipient('${r.name}','${r.id||r.phone}')"><span class="recipient-avatar">${initials}</span><span><b>${r.name}</b><small class="muted"> · ${r.id||r.phone||''}</small></span></button>`}).join('');return `<section class="view">${pageIntro('Send money','Transfer funds to another ZedMoney wallet securely.') }<div class="card form-card"><div class="form-grid"><div class="field full"><label for="recipient-search">Recipient</label><input id="recipient-search" placeholder="Phone number, username or ZedMoney ID"><span class="helper">Choose one of your saved recipients.</span><div class="recipient-list">${recs||'<span class="helper">No saved recipients yet.</span>'}</div></div><div class="field"><label for="send-amount">Amount</label><input id="send-amount" type="number" placeholder="0.00"><span class="helper">Available: ${cur} ${avail.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div><div class="field"><label for="send-note">Note</label><input id="send-note" placeholder="What’s this for?"></div></div><div class="summary"><div class="summary-row"><span>Recipient</span><strong id="send-recipient">Select a recipient</strong></div></div><div class="form-actions"><button class="secondary-btn" onclick="goBack()">Cancel</button><button class="primary-btn" onclick="startFlow('send')">${icons.send} Send</button></div></div></section>`;}
      function receive(){const id=currentProfile().zedmoney_id||'—';const payers=state.recipients.map(r=>`<button type="button" class="recipient" onclick="selectRequestPayer('${r.id||r.phone}','${r.name}')"><span class="recipient-avatar">${(r.name||'R').slice(0,2).toUpperCase()}</span><span><b>${r.name}</b><small class="muted"> · ${r.id||r.phone||''}</small></span></button>`).join('');return `<section class="view">${pageIntro('Receive money','Share your wallet ID or request a specific amount.') }<div class="card form-card"><h2>Your ZedMoney ID</h2><p class="subtitle">People can use this ID to send money directly to you.</p><div class="id-box"><div><span class="small muted">Personal wallet ID</span><strong>${id}</strong></div><div class="id-actions"><button class="icon-label-btn" onclick="copyText('${id}')">${icons.copy} Copy</button><button class="icon-label-btn" onclick="showToast('Share sheet opened')">${icons.share} Share</button></div></div><h2 class="spacer-top">Request money</h2><p class="subtitle">Create a request to send to someone you know.</p><div class="form-grid spacer-top"><div class="field"><label for="request-amount">Amount</label><input id="request-amount" type="number" min="0.01"></div><div class="field"><label for="request-person">From</label><input id="request-person" placeholder="Phone, username or ID"><span class="helper">Select a saved recipient below.</span><div class="recipient-list">${payers||'<span class="helper">Add a recipient first.</span>'}</div></div><div class="field full"><label for="request-note">Note <span class="muted">(optional)</span></label><textarea id="request-note" placeholder="Add a short note"></textarea></div></div><div class="form-actions"><button class="primary-btn" onclick="createLiveRequest()">${icons.receive} Create request</button></div></div></section>`;}
      function addMoney() { const methods=[['mobile','Mobile Money','MTN, Airtel or Zamtel','wallet']]; const bonus=window.zedmoneyProfile?.bonus; return `<section class="view">${pageIntro('Add money','Enter an amount and approve the Lipila prompt on your saved phone.') }<div class="card form-card wide"><label>Payment method</label><div class="method-grid">${methods.map(m=>`<button class="method selected" ${state.depositBusy?'disabled':''} onclick="state.paymentMethod='${m[0]}';render()"><span class="method-icon">${icons[m[3]]}</span><b>${m[1]}</b><span>${m[2]}</span></button>`).join('')}</div>${bonus?.enabled?`<div class="notice spacer-top">${icons.check}<span><strong>${liveCurrency()} ${Number(bonus.amount||0).toFixed(2)} signup bonus is active.</strong> It is credited once when a new account is created; deposits are processed separately.</span></div>`:''}${addMethodBody()}<div class="form-actions"><button class="secondary-btn" ${state.depositBusy?'disabled':''} onclick="goBack()">Cancel</button><button class="primary-btn" ${state.depositBusy?'disabled':''} onclick="startFlow('deposit')">${icons.plus} Add money</button></div></div></section>`; }
      function addMethodBody() { const p=currentProfile(),phone=p.phone||'No saved Zambian number'; return `<div class="form-grid"><div class="field"><label>Saved mobile number</label><div class="id-box" style="margin:0;min-height:48px"><strong>${phone}</strong><span class="small muted">${p.phone?'The prompt will be sent here.':'Add a phone number in Profile first.'}</span></div></div><div class="field"><label for="deposit-amount">Amount</label><input id="deposit-amount" type="number" min="0.01" step="0.01" placeholder="0.00" ${state.depositBusy?'disabled':''}><span class="helper">You will approve the payment on your phone. No phone number entry is needed.</span></div></div>`; }
    function withdraw(){const cur=liveCurrency();return `<section class="view">${pageIntro('Withdraw money','Funds are reserved immediately and submitted to Lipila after the 24-hour withdrawal hold.') }<div class="card form-card"><div class="form-grid"><div class="field"><label for="withdraw-amount">Amount</label><input id="withdraw-amount" type="number" min="0.01"><span class="helper">Available: ${cur} ${walletAmount('available_balance').toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div><div class="field"><label>Destination</label><input id="withdraw-destination" inputmode="tel" placeholder="260971234567"></div></div><div class="summary"><div class="summary-row"><span>Available balance</span><strong>${cur} ${walletAmount('available_balance').toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</strong></div><div class="summary-row total"><span>Wallet status</span><strong>${liveStatus()}</strong></div></div><div class="form-actions"><button class="secondary-btn" onclick="goBack()">Cancel</button><button class="primary-btn" onclick="startFlow('withdraw')">${icons.withdraw} Withdraw</button></div></div></section>`;}
     function links() { return `<section class="view">${pageIntro('Payment links','Create simple, trackable ways to request money.',`<button class="primary-btn" onclick="navigate('create-link')">${icons.plus} Create link</button>`) }<div class="toolbar"><div class="segmented">${['All','Active','Disabled'].map(x=>`<button class="segment ${state.linkFilter===x?'active':''}" onclick="state.linkFilter='${x}';render()">${x}</button>`).join('')}</div><span class="small muted">${state.links.filter(l=>state.linkFilter==='All'||l.status===state.linkFilter).length} links</span></div><div class="links-grid">${state.links.filter(l=>state.linkFilter==='All'||l.status===state.linkFilter).map(linkCard).join('')}</div></section>`; }
    function linkCard(l) { return `<article class="card payment-link"><div class="payment-link-head"><div><h3>${l.name}</h3><span class="link-amount">${positiveMoney(l.amount)}</span></div>${badge(l.status)}</div><div class="link-url">pay.zedmoney.test/${l.code}</div><p class="small muted">${l.description} · Expires ${l.expires}</p><div class="link-actions"><button onclick="copyText('pay.zedmoney.test/${l.code}')">${icons.copy} Copy</button><button onclick="showToast('Share sheet opened for this demo')">${icons.share} Share</button><button onclick="showToast('Payment link preview opened')">View</button>${l.status==='Active'?`<button onclick="disableLink('${l.code}')">Disable</button>`:''}</div></article>`; }
    function createLink() { return `<section class="view">${pageIntro('Create payment link','Set the amount and details for your new request.') }<div class="card form-card"><div class="form-grid"><div class="field full"><label for="link-name">Link name</label><input id="link-name" placeholder="e.g. Design retainer" value="New payment request"></div><div class="field"><label for="link-amount">Amount</label><input id="link-amount" type="number" value="500"></div><div class="field"><label for="link-currency">Currency</label><select id="link-currency"><option>ZMW — Zambian Kwacha</option></select></div><div class="field full"><label for="link-description">Description</label><textarea id="link-description" placeholder="What is this payment for?">Wallet contribution</textarea></div><div class="field"><label for="link-expiry">Expiration</label><select id="link-expiry"><option>7 days</option><option>30 days</option><option>90 days</option></select></div></div><div class="form-actions"><button class="secondary-btn" onclick="navigate('links')">Cancel</button><button class="primary-btn" onclick="createPaymentLink()">${icons.link} Create payment link</button></div></div></section>`; }
    function transactionsPage() { let list=transactions.filter(t=>{const term=state.txSearch.toLowerCase(); const search=!term||[t.title,t.sub,t.id,t.party].join(' ').toLowerCase().includes(term); const type=state.txType==='All'||(state.txType==='Money In'&&t.amount>0)||(state.txType==='Money Out'&&t.amount<0)||(state.txType==='Transfers'&&t.title.includes('money'))||(state.txType==='Payments'&&['Airtime','Groceries','Lunch','Payment','Electricity bill','Internet bill'].includes(t.title)); const status=state.txStatus==='All'||t.status===state.txStatus; return search&&type&&status; }); const start=(state.page-1)*8; const shown=list.slice(start,start+8); return `<section class="view">${pageIntro('Transactions','Every movement in and out of your wallet, in one place.') }<div class="card transactions-card"><div class="toolbar"><div class="search-box">${icons.search}<input placeholder="Search transactions" value="${state.txSearch}" oninput="state.txSearch=this.value;state.page=1;render()"></div><div class="filter-row"><select class="filter-select" onchange="state.txType=this.value;state.page=1;render()"><option>All</option><option>Money In</option><option>Money Out</option><option>Transfers</option><option>Payments</option></select><select class="filter-select" onchange="state.txStatus=this.value;state.page=1;render()"><option>All</option><option>Completed</option><option>Pending</option><option>Failed</option></select></div></div>${shown.length?`<div class="table-wrap"><table><thead><tr><th>Transaction</th><th>Reference</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>${shown.map(t=>`<tr onclick="openTransaction('${t.id}')"><td><div class="table-tx">${transactionIcon(t)}<span><b>${t.title}</b><br><small class="muted">${t.sub}</small></span></div></td><td class="muted">${t.id}</td><td class="muted">${t.date}</td><td style="font-weight:650;color:${t.amount>0?'var(--green)':'var(--ink)'}">${money(t.amount)}</td><td>${badge(t.status)}</td></tr>`).join('')}</tbody></table></div><div class="pagination"><span>Showing ${start+1}–${Math.min(start+shown.length,list.length)} of ${list.length}</span><div class="pagination-actions"><button onclick="state.page=Math.max(1,state.page-1);render()" aria-label="Previous page">‹</button><button onclick="state.page++;render()" aria-label="Next page">›</button></div></div>`:`<div class="empty">${icons.clock}<h3>No transactions found</h3><p>Try a different search or filter.</p><button class="secondary-btn" onclick="state.txSearch='';state.txType='All';state.txStatus='All';render()">Clear filters</button></div>`}</div></section>`; }
    function analytics() { return `<section class="view">${pageIntro('Your analytics','Understand your money habits without the noise of a business dashboard.') }<div class="stats-row"><div class="card stat-card"><div class="stat-label">Spending</div><div class="stat-value">K 4,280</div><div class="stat-detail">Across 42 payments</div></div><div class="card stat-card"><div class="stat-label">Money received</div><div class="stat-value">K 9,840</div><div class="stat-detail">From 18 deposits</div></div><div class="card stat-card"><div class="stat-label">Net movement</div><div class="stat-value" style="color:var(--green)">+ K 5,560</div><div class="stat-detail">This month</div></div></div><div class="two-col"><div class="card chart-card"><div class="chart-header"><div><h2>Weekly activity</h2><p class="subtitle">Your wallet flow this week.</p></div><div class="segmented"><button class="segment active">Week</button><button class="segment">Month</button></div></div>${lineChart()}</div><div class="card chart-card"><div class="section-heading"><h2>Spending categories</h2><span class="small muted">K 4,280 total</span></div><div class="category-list">${[['Food','K 1,340',82],['Transport','K 860',54],['Airtime','K 520',34],['Bills','K 960',59],['Shopping','K 420',26],['Transfers','K 180',11]].map(c=>`<div class="category-row"><b>${c[0]}</b><span>${c[1]}</span><div class="category-bar"><i style="width:${c[2]}%"></i></div></div>`).join('')}</div></div></div></section>`; }
    function security() { return `<section class="view">${pageIntro('Security','A calm overview of the settings that will protect your wallet.') }<div class="card form-card wide"><div class="security-banner">${icons.shield}<div><strong>Account protected</strong><p>Your wallet is designed with multiple layers of security. These controls are visual demonstrations until your account is connected.</p></div></div><div class="security-list">${[['Login security','Last reviewed today', 'shield'],['Transaction PIN','Enabled for demo', 'settings'],['Biometric login','Available on this device','user'],['Trusted devices','1 device connected','wallet'],['Session management','No other sessions','clock'],['Two-step verification','Not enabled','info']].map(x=>`<div class="security-item"><span class="method-icon">${icons[x[2]]}</span><div><strong>${x[0]}</strong><span>${x[1]}</span></div><span class="chevron">${icons.arrow}</span></div>`).join('')}</div></div></section>`; }
     function settings(){const p=currentProfile(),cur=liveCurrency();return `<section class="view">${pageIntro('Settings','Personalise your wallet experience.') }<div class="settings-grid"><div class="card settings-section"><h3>Account</h3>${[['Profile',displayName(),'arrow'],['Phone number',p.phone||'Not set','arrow'],['Email',window.zedmoneyProfile?.user?.email||'Not available','arrow']].map(settingRow).join('')}</div><div class="card settings-section"><h3>Preferences</h3>${[['Notifications','Receive wallet updates','switch'],['Language','English','arrow'],['Currency',`${cur} — account currency`,'arrow']].map(settingRow).join('')}</div><div class="card settings-section"><h3>Security</h3>${[['Account status',p.status||'active','arrow'],['Verification',p.verification_status||'unverified','arrow'],['Devices','Manage trusted devices','arrow']].map(settingRow).join('')}</div></div></section>`;}

    function airtime() { return `<section class="view">${pageIntro('Buy airtime','Top up any Zambian mobile number in a few steps.') }<div class="card form-card"><div class="field"><label>Network</label><div class="segmented" style="width:100%">${['MTN','Airtel','Zamtel'].map(x=>`<button class="segment ${state.airtimeNetwork===x?'active':''}" onclick="state.airtimeNetwork='${x}';render()">${x}</button>`).join('')}</div></div><div class="form-grid spacer-top"><div class="field"><label for="airtime-phone">Phone number</label><input id="airtime-phone" value="+260 97 123 4567"></div><div class="field"><label for="airtime-amount">Amount</label><input id="airtime-amount" type="number" value="50"></div></div><div class="recipient-list">${[10,20,50,100].map(x=>`<button class="recipient" onclick="document.getElementById('airtime-amount').value=${x}"><span class="recipient-avatar">K</span><b>K ${x}</b></button>`).join('')}</div><div class="summary"><div class="summary-row"><span>Airtime amount</span><strong id="airtime-summary">K 50.00</strong></div><div class="summary-row"><span>ZedMoney fee</span><strong>K 0.00</strong></div><div class="summary-row total"><span>Total</span><strong>K 50.00</strong></div></div><div class="form-actions"><button class="secondary-btn" onclick="goBack()">Cancel</button><button class="primary-btn" onclick="startFlow('airtime')">${icons.phone} Buy airtime</button></div></div></section>`; }
    function bills() { const billTypes=[['Airtime','Mobile top-ups','phone'],['Data','Internet bundles','wallet'],['Electricity','ZESCO payments','bill'],['TV','DSTV and GOtv','card'],['Internet','Home internet','link'],['Water','Water utilities','receive'],['Other bills','More providers','more']]; return `<section class="view">${pageIntro('Bills & payments','Pay everyday services using a simple wallet flow.') }<div class="feature-grid">${billTypes.map(x=>`<button class="feature-tile" onclick="${x[0]==='Airtime'?"navigate('airtime')":`state.billType='${x[0]}';openBillForm()`}" ><span class="method-icon">${icons[x[2]]}</span><span><strong>${x[0]}</strong><small>${x[1]}</small></span>${icons.arrow}</button>`).join('')}</div><div class="card form-card spacer-top"><h2>${state.billType||'Electricity'} payment</h2><p class="subtitle">A realistic demo form. No provider is connected yet.</p><div class="form-grid spacer-top"><div class="field"><label>Provider</label><select><option>${state.billType||'Electricity'} provider</option><option>Another provider</option></select></div><div class="field"><label>Account / meter number</label><input placeholder="Enter account number"></div><div class="field"><label>Amount</label><input type="number" value="250"></div><div class="field"><label>Currency</label><select><option>ZMW — Zambian Kwacha</option><option disabled>USD — coming later</option></select></div></div><div class="summary"><div class="summary-row"><span>Amount</span><strong>K 250.00</strong></div><div class="summary-row"><span>ZedMoney fee <small>(demo)</small></span><strong>K 2.00</strong></div><div class="summary-row"><span>Provider fee <small>(demo)</small></span><strong>K 1.50</strong></div><div class="summary-row total"><span>Total</span><strong>K 253.50</strong></div></div><div class="form-actions"><button class="primary-btn" onclick="startFlow('bill')">${icons.bill} Continue to payment</button></div></div></section>`; }
    function qrPayments() { const mode=state.qrMode||'my'; const cells=Array.from({length:169},(_,i)=>`<i></i>`).join(''); return `<section class="view">${pageIntro('QR payments','Scan a merchant code or share your own ZedMoney QR.') }<div class="segmented"><button class="segment ${mode==='scan'?'active':''}" onclick="state.qrMode='scan';render()">${icons.scan} Scan QR</button><button class="segment ${mode==='my'?'active':''}" onclick="state.qrMode='my';render()">${icons.qr} My QR</button></div><div class="qr-layout spacer-top"><div class="card qr-card">${mode==='scan'?`<span class="method-icon" style="margin:0 auto;width:54px;height:54px">${icons.scan}</span><h2>Scan a payment QR</h2><p class="qr-copy">Use your camera when QR payments are connected. For now, this preview shows the scan experience.</p><button class="primary-btn" onclick="showToast('Camera access is disabled in demo mode')">${icons.scan} Open scanner</button>`:`<span class="small muted">Your personal QR</span><div class="qr-code">${cells}</div><h2>Daniel · ZM-001928</h2><p class="qr-copy">Share this code to receive money to your ZedMoney wallet.</p><div class="page-actions" style="justify-content:center"><button class="secondary-btn" onclick="copyText('ZM-001928')">${icons.copy} Copy ID</button><button class="primary-btn" onclick="showToast('QR share sheet opened')">${icons.share} Share</button></div>`}</div><div class="card card-pad"><h2>How QR payments work</h2><p class="subtitle">QR payments will make in-person transfers faster once connected to your wallet backend.</p><div class="setting-row"><span class="setting-copy"><strong>Scan a merchant</strong><span>Point your camera at a ZedMoney code.</span></span><span class="method-icon">${icons.scan}</span></div><div class="setting-row"><span class="setting-copy"><strong>Review the amount</strong><span>Confirm the recipient and fee before paying.</span></span><span class="method-icon">${icons.check}</span></div><div class="setting-row"><span class="setting-copy"><strong>Share your QR</strong><span>Let someone pay your wallet directly.</span></span><span class="method-icon">${icons.share}</span></div></div></div></section>`; }

    function statements() { return `<section class="view">${pageIntro('Statements','Review and download a simple wallet activity statement.') }<div class="card form-card wide"><div class="segmented">${['This month','Last month','Custom date'].map(x=>`<button class="segment ${state.statementRange===x||(!state.statementRange&&x==='This month')?'active':''}" onclick="state.statementRange='${x}';render()">${x}</button>`).join('')}</div><div class="summary-kpis spacer-top"><div class="summary-kpi"><span>Money in</span><strong>${liveCurrency()} ${Number(window.zedmoneyProfile?.analytics?.total_received||0).toLocaleString('en-US',{minimumFractionDigits:2})}</strong><span>Database-derived</span></div><div class="summary-kpi"><span>Money out</span><strong>${liveCurrency()} ${Number(window.zedmoneyProfile?.analytics?.total_sent||0).toLocaleString('en-US',{minimumFractionDigits:2})}</strong><span>Database-derived</span></div><div class="summary-kpi"><span>Fees</span><strong>${liveCurrency()} ${Number(window.zedmoneyProfile?.analytics?.fees||0).toLocaleString('en-US',{minimumFractionDigits:2})}</strong><span>Database-derived</span></div><div class="summary-kpi"><span>Closing balance</span><strong>${liveCurrency()} ${walletAmount('available_balance').toLocaleString('en-US',{minimumFractionDigits:2})}</strong><span>${liveCurrency()}</span></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Money in</th><th>Money out</th></tr></thead><tbody>${transactions.slice(0,5).map(t=>`<tr><td>${t.date}</td><td>${t.title}</td><td style="color:var(--green)">${t.amount>0?money(t.amount):'—'}</td><td>${t.amount<0?money(t.amount):'—'}</td></tr>`).join('')}</tbody></table></div><div class="form-actions"><button class="secondary-btn" onclick="downloadStatement('csv')">${icons.download} Download CSV</button><button class="primary-btn" onclick="downloadStatement('txt')">${icons.download} Download statement</button></div></div></section>`; }
    function limits() { return `<section class="view">${pageIntro('Wallet limits','Transparent demo limits help you understand how the wallet could work.') }<div class="card form-card wide"><div class="status-strip">${icons.info}<span>Limits shown are mock data and are not enforced.</span></div><div class="spacer-top">${[['Daily sending','K 5,000','K 10,000',50],['Daily withdrawal','K 3,000','K 5,000',60],['Monthly transactions','K 42,500','K 100,000',42]].map(x=>`<div class="limit-row"><div class="limit-head"><b>${x[0]}</b><span>${x[1]} / ${x[2]}</span></div><div class="limit-bar"><i style="width:${x[3]}%"></i></div></div>`).join('')}</div><p class="helper spacer-top">Your final limits will depend on wallet configuration and future account setup.</p></div></section>`; }
     function profile(){const p=currentProfile(),w=currentWallet(),cur=liveCurrency();return `<section class="view">${pageIntro('Profile','Keep your wallet identity and contact details up to date.') }<div class="two-col"><div class="card form-card"><div style="display:flex;align-items:center;gap:13px;margin-bottom:22px"><span class="avatar" style="width:50px;height:50px;font-size:17px">${profileInitials()}</span><div><h2 style="margin:0 0 4px">${displayName()}</h2><span class="muted small">${p.username?`@${p.username}`:'Personal wallet'}</span></div></div><div class="form-grid"><div class="field"><label for="profile-first-name">First name</label><input id="profile-first-name" value="${p.first_name||''}" maxlength="80"></div><div class="field"><label for="profile-last-name">Last name</label><input id="profile-last-name" value="${p.last_name||''}" maxlength="80"></div><div class="field"><label for="profile-username">Username</label><input id="profile-username" value="${p.username||''}" maxlength="30"><span class="helper">3–30 letters, numbers, or underscores.</span></div><div class="field"><label for="profile-phone">Zambian phone number</label><input id="profile-phone" value="${p.phone||''}" placeholder="+260 97 000 0000"><span class="helper">Accepted networks: Zamtel, MTN, Airtel.</span></div><div class="field full"><label for="profile-display-name">Display name</label><input id="profile-display-name" value="${p.display_name||''}" maxlength="120"></div></div><div class="form-actions"><button class="primary-btn" onclick="saveProfile()">${icons.check} Save profile</button></div></div><div class="card form-card"><h2>Wallet</h2><p class="subtitle">Authoritative account balance and account identifiers.</p><div class="detail-list spacer-top"><div class="detail-row"><span>ZedMoney ID</span><strong>${p.zedmoney_id||'—'}</strong></div><div class="detail-row"><span>Email</span><strong>${window.zedmoneyProfile?.user?.email||'—'}</strong></div><div class="detail-row"><span>Account status</span><strong style="color:var(--green)">${p.status||'active'}</strong></div><div class="detail-row"><span>Wallet</span><strong>${w.wallet_identifier||'—'}</strong></div></div><div class="summary spacer-top"><div class="summary-row"><span>Available</span><strong>${cur} ${walletAmount('available_balance').toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</strong></div><div class="summary-row"><span>Pending</span><strong>${cur} ${walletAmount('pending_balance').toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</strong></div><div class="summary-row total"><span>Wallet status</span><strong>${w.status||'active'}</strong></div></div></div></div></section>`;}
    function helpCenter() { const topics=[['Getting started','Set up your wallet workspace','info'],['Adding money','Fund your wallet safely','plus'],['Sending money','Move money to someone','send'],['Withdrawals','Move money out','withdraw'],['Payment links','Request payments with a link','link'],['Security','Keep your wallet protected','shield'],['Fees','Understand demo fee previews','bill']]; return `<section class="view">${pageIntro('Help center','Find your way around ZedMoney.') }<div class="card form-card wide"><div class="search-box">${icons.search}<input placeholder="Search help articles" oninput="filterHelp(this.value)"></div><div class="help-grid spacer-top" id="help-topics">${topics.map(x=>`<button class="help-topic" data-topic="${x[0].toLowerCase()}"><span>${icons[x[2]]}</span><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div></div></section>`; }
     function referral(){const code=currentProfile().zedmoney_id||currentProfile().username||'—';return `<section class="view">${pageIntro('Invite friends','Share your authenticated ZedMoney identity with people you trust.') }<div class="card form-card"><div class="id-box"><div><span class="small muted">Your ZedMoney ID</span><strong>${code}</strong></div><div class="id-actions"><button class="icon-label-btn" onclick="copyText('${code}')">${icons.copy} Copy ID</button><button class="icon-label-btn" onclick="showToast('Share sheet opened')">${icons.share} Share</button></div></div></div></section>`;}
    function merchant() { return `<section class="view">${pageIntro('Merchant mode','A preview of the business tools that could sit alongside your personal wallet.') }<div class="status-strip">${icons.info}<span>Merchant mode is a frontend preview and does not create a business account.</span></div><div class="feature-grid spacer-top">${[['Receive payments','Accept wallet payments','receive'],['Payment links','Request from customers','link'],['QR','Display your merchant code','qr'],['Sales','Track daily sales','chart'],['Transactions','Review payments','clock'],['Settlement','See settlement activity','bank'],['Analytics','Understand your business','grid']].map(x=>`<button class="feature-tile" onclick="showToast('${x[0]} is a demo preview')"><span class="method-icon">${icons[x[2]]||icons.grid}</span><span><strong>${x[0]}</strong><small>${x[1]}</small></span>${icons.arrow}</button>`).join('')}</div></section>`; }
    function openBillForm(){ state.billType=state.billType||'Electricity'; render(); }
    async function addRecipient(){ const label=prompt('Recipient name'); if(!label)return; const phone=prompt('Phone number (optional)')||''; try{await liveApi('/api/recipients',{method:'POST',body:{label,phone,favorite:false}});await refreshWalletData();showToast('Recipient added');}catch(e){showToast(e.message||'Unable to add recipient');} }
    async function editRecipient(index){ const r=state.recipients[index]; if(!r?.dbId)return; const label=prompt('Edit recipient name',r.name); if(!label)return; const phone=prompt('Edit phone number',r.phone)||''; try{await liveApi(`/api/recipients/${encodeURIComponent(r.dbId)}`,{method:'PATCH',body:{label,phone}});await refreshWalletData();showToast('Recipient updated');}catch(e){showToast(e.message||'Unable to update recipient');} }
    async function deleteRecipient(index){ const r=state.recipients[index]; if(!r?.dbId||!confirm(`Remove ${r.name} from saved recipients?`))return; try{await liveApi(`/api/recipients/${encodeURIComponent(r.dbId)}`,{method:'DELETE'});await refreshWalletData();showToast('Recipient removed');}catch(e){showToast(e.message||'Unable to remove recipient');} }
    async function toggleFavorite(index){const r=state.recipients[index];if(!r?.dbId)return;try{await liveApi(`/api/recipients/${encodeURIComponent(r.dbId)}`,{method:'PATCH',body:{favorite:!r.favorite}});await refreshWalletData();showToast(r.favorite?'Removed from favorites':'Recipient added to favorites');}catch(e){showToast(e.message||'Unable to update recipient');}}
    async function createRequest(){const r=state.recipients.find(x=>x.id||x.phone);const amount=Number(document.querySelector('#request-amount')?.value||0);if(!r?.id||!amount)return showToast('Select a recipient and enter an amount.');try{await liveApi('/api/requests',{method:'POST',body:{payer_id:r.id,amount,currency:liveCurrency(),note:document.querySelector('#request-note')?.value||''}});await refreshWalletData();showToast('Request created');}catch(e){showToast(e.message||'Unable to create request');}}
    function downloadStatement(type){const lines=['ZedMoney wallet statement','Period: '+(state.statementRange||'This month'),'Currency: ZMW','','Date,Description,Money in,Money out',...transactions.map(t=>`${t.date},"${t.title}",${t.amount>0?t.amount.toFixed(2):''},${t.amount<0?Math.abs(t.amount).toFixed(2):''}`)];const blob=new Blob([lines.join('\\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`zedmoney-statement.${type==='csv'?'csv':'txt'}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);showToast('Statement download started');}
    function filterHelp(term){const q=term.toLowerCase();document.querySelectorAll('#help-topics .help-topic').forEach(x=>x.style.display=!q||x.dataset.topic.includes(q)?'block':'none');}
    function openActionSheet(){state.flow='action-menu';document.body.insertAdjacentHTML('beforeend',actionSheetMarkup());}
    function actionSheetMarkup(){const actions=[['add','Add money','Mobile Money, card or USSD','plus'],['send','Send money','To a ZedMoney recipient','send'],['withdraw','Withdraw','To mobile money or bank','withdraw'],['requests','Request money','Ask for a payment','receive'],['qr','Scan QR','Pay in person','qr'],['bills','Pay a bill','Airtime, electricity and more','bill'],['transactions','View transactions','Review wallet activity','clock'],['settings','Settings','Preferences and security','settings']];return `<div class="modal-backdrop open" id="action-modal" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>What would you like to do?</h2><button class="icon-btn" onclick="closeModal()">${icons.close}</button></div><div class="modal-body"><div class="action-sheet">${actions.map(a=>`<button class="sheet-action" onclick="closeModal();navigate('${a[0]}')"><span class="method-icon">${icons[a[3]]}</span><span><strong>${a[1]}</strong><small>${a[2]}</small></span>${icons.arrow}</button>`).join('')}</div></div></div></div>`;}
    function openGlobalSearch(){state.flow='global-search';document.body.insertAdjacentHTML('beforeend',globalSearchMarkup());document.querySelector('#global-search-input')?.focus();}
    function globalSearchMarkup(){const results=[['Transactions','Search your wallet activity','transactions','clock'],['Brian','Saved recipient · +260 97 000 1842','beneficiaries','user'],['Payment links','Manage requests and links','links','link'],['Security center','Review wallet protection','security','shield'],['Help center','Find answers to common questions','help','help']];return `<div class="modal-backdrop open" id="search-modal" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>Search ZedMoney</h2><button class="icon-btn" onclick="closeModal()">${icons.close}</button></div><div class="modal-body"><div class="search-box">${icons.search}<input id="global-search-input" placeholder="Search transactions, recipients, links..." oninput="searchGlobalResults(this.value)"></div><div id="global-results" class="spacer-top">${results.map(r=>`<button class="search-result" data-search="${r[0].toLowerCase()} ${r[1].toLowerCase()}" onclick="closeModal();navigate('${r[2]}')"><span class="method-icon">${icons[r[3]]}</span><span><strong>${r[0]}</strong><small>${r[1]}</small></span>${icons.arrow}</button>`).join('')}</div><p class="helper spacer-top">Tip: press / from anywhere to open search.</p></div></div></div>`;}
    function searchGlobalResults(term){const q=term.toLowerCase();document.querySelectorAll('#global-results .search-result').forEach(x=>x.style.display=!q||x.dataset.search.includes(q)?'flex':'none');}
      function notificationCategory(n){const type=String(n.type||'').toLowerCase();if(/security|login|pin|device|password/.test(type))return'Security';if(/payment|bonus|request|link/.test(type))return'Payments';return'Transactions';}
      function notificationsCenter(){const notes=window.zedmoneyNotifications||[],filtered=notes.filter(n=>state.notificationFilter==='All'||notificationCategory(n)===state.notificationFilter);return `<section class="view">${pageIntro('Notifications','Stay up to date with your real wallet activity.') }<div class="card transactions-card"><div class="toolbar"><div class="segmented">${['All','Transactions','Security','Payments'].map(x=>`<button class="segment ${state.notificationFilter===x?'active':''}" onclick="state.notificationFilter='${x}';render()">${x}</button>`).join('')}</div><button class="text-btn" onclick="markAllNotificationsRead()">Mark all read</button></div>${filtered.map(n=>{const read=Boolean(n.read_at||n.read);return `<article class="notification ${read?'':'unread'}"><span class="notification-icon">${notificationCategory(n)==='Security'?icons.shield:notificationCategory(n)==='Payments'?icons.card:icons.bell}</span><div><strong>${n.title||'Wallet update'}</strong><p>${n.message||'Your wallet activity has been updated.'}</p>${n.type==='welcome_bonus'?'<button class="text-btn" onclick="navigate(\'add\')">View add-money options</button>':''}<time>${formatDate(n.created_at)}</time>${!read&&n.id?`<button class="text-btn" onclick="markNotificationRead('${n.id}')">Mark as read</button>`:''}</div>${read?'':'<i class="notification-unread" aria-label="Unread"></i>'}</article>`;}).join('')||'<div class="empty"><div class="empty-icon">'+icons.bell+'</div><h3>You’re all caught up</h3><p>You don’t have any new notifications in this category.</p></div>'}</div></section>`;}
    function showConfirm(title,copy,confirmLabel,action){state.flow='confirm';document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop open" id="confirm-modal" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()">${icons.close}</button></div><div class="modal-body"><p class="subtitle">${copy}</p><div class="modal-actions"><button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn" onclick="closeModal();${action}">${confirmLabel}</button></div></div></div></div>`);}
    function freezeWallet(){state.walletFrozen=true;render();showToast('Wallet frozen in demo mode');}

     function receiptTransaction(){return state.selectedTx||transactions[0]||null;}
     function downloadReceipt(){const t=receiptTransaction();if(!t)return showToast('There is no completed transaction to download.');const fee=Number(String(t.fee||'').replace(/[^\d.-]/g,''))||0,total=Math.abs(Number(t.amount)||0)+fee;const text=`ZedMoney\n${t.status||'Transaction'}\nAmount: ${money(t.amount)}\nReference: ${t.id}\nDate: ${t.date}\nFee: ${t.fee||money(0)}\nTotal: ${currencyCode()} ${total.toFixed(2)}`;const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`zedmoney-receipt-${t.id}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);showToast('Receipt download started');}
     function receipt(){const t=receiptTransaction();return `<section class="view">${pageIntro('Payment receipt','A printable record of an authenticated transaction.') }${t?`<div class="card receipt"><div class="receipt-head">${logo}<h2>Transaction record</h2>${badge(t.status||'Completed')}<div class="receipt-amount">${money(t.amount)}</div><p class="muted small">${t.title||'Wallet transaction'}</p></div><div class="detail-list"><div class="detail-row"><span>Reference</span><strong>${t.id}</strong></div><div class="detail-row"><span>Date</span><strong>${t.date}</strong></div><div class="detail-row"><span>Fee</span><strong>${t.fee||money(0)}</strong></div></div><div class="receipt-actions"><button class="secondary-btn" onclick="showToast('Share options are not available in this browser.')">${icons.share} Share receipt</button><button class="primary-btn" onclick="downloadReceipt()">${icons.download} Download receipt</button></div></div>`:'<div class="card empty"><div class="empty-icon">'+icons.card+'</div><h3>No receipt available</h3><p>Complete a wallet transaction to view its receipt here.</p></div>'}</section>`;}
    function startFlow(kind,confirmed=false){if(!confirmed&&['send','withdraw','deposit','airtime','bill'].includes(kind)){const labels={send:['Send K 250?','To Brian · Amount K 250.00','Confirm send'],withdraw:['Withdraw K 600?','To +260 97 555 9012 · You receive K 594.00','Confirm withdrawal'],deposit:['Add K 500?','Using '+(state.paymentMethod==='mobile'?'Mobile Money':state.paymentMethod)+' · Fee K 5.00','Confirm payment'],airtime:['Buy K 50 airtime?','To +260 97 123 4567 · '+(state.airtimeNetwork||'MTN'),'Confirm purchase'],bill:['Pay K 250 bill?','Electricity · Fee preview K 3.50','Confirm payment']}[kind];showConfirm(labels[0],labels[1],labels[2],`startFlow('${kind}',true)`);return;}closeModal();state.flow=kind;document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop open" id="flow-modal"><div class="modal"><div class="processing"><svg class="logo-mark" style="color:var(--navy-900)" viewBox="0 0 48 48"><path fill="currentColor" d="M24 3.5 40 9v12.3c0 10.1-6.5 18.9-16 23.2-9.5-4.3-16-13.1-16-23.2V9L24 3.5Z"/><path fill="#79c4ca" d="M24 9.2 34.4 13v8.1c0 6.9-4.1 13-10.4 16.5-6.3-3.5-10.4-9.6-10.4-16.5V13L24 9.2Z"/><path fill="#fff" d="m17.6 23.3 4.2 4.2 9.1-10.1 2.2-2-11.2 12.5-6.4-6.4 2.1-2.2Z"/></svg><div class="dotted-loader"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><h2 id="flow-title">${kind==='withdraw'?'Processing withdrawal':kind==='send'?'Processing payment':'Processing payment'}</h2><p id="flow-copy">Checking payment status...</p></div></div></div>`);setTimeout(()=>{const t=document.getElementById('flow-title'),c=document.getElementById('flow-copy');if(t){t.textContent=kind==='withdraw'?'Withdrawal completed':kind==='send'?'Payment successful':kind==='airtime'?'Airtime purchased':'Payment completed';c.textContent='Transaction completed';document.querySelector('#flow-modal .dotted-loader').outerHTML='<div class="success-mark">'+icons.check+'</div>';document.querySelector('#flow-modal .processing').insertAdjacentHTML('beforeend',`<div class="receipt-actions"><button class="secondary-btn" onclick="closeFlow();navigate('receipt')">${icons.print} View receipt</button><button class="primary-btn" onclick="closeFlow();showToast('Demo transaction completed')">Done</button></div>`);}},2100);}
    function security(){return `<section class="view">${pageIntro('Security center','Review the controls that keep your wallet experience protected.') }<div class="card form-card wide"><div class="security-banner">${icons.shield}<div><strong>Account security · Strong</strong><p>Your demo wallet is configured with reassuring security controls. These are visual previews until a backend is connected.</p></div></div><div class="security-list">${[['Transaction PIN','Enabled','settings'],['Biometric login','Enabled','user'],['Two-step verification','Enabled','shield'],['Active devices','2 devices','device'],['Recent sessions','3 sessions','clock'],['Login alerts','On','bell'],['Transaction alerts','On','bell'],['Wallet status',state.walletFrozen?'Frozen':'Active','lock']].map(x=>`<div class="security-item"><span class="method-icon">${icons[x[2]]}</span><div><strong>${x[0]}</strong><span>${x[1]}</span></div><span class="chevron">${icons.arrow}</span></div>`).join('')}</div><div class="spacer-top">${state.walletFrozen?`<div class="security-banner" style="background:var(--amber-bg);border-color:#f1dfaf;color:var(--amber)">${icons.lock}<div><strong style="color:var(--amber)">Wallet frozen</strong><p style="color:var(--amber)">Transactions are paused in this demo until you unfreeze the wallet.</p></div><button class="secondary-btn" onclick="unfreezeWallet()">Unfreeze</button></div>`:`<button class="danger-btn" onclick="showConfirm('Freeze ZedMoney Wallet?','Freezing your wallet temporarily prevents transactions from being made.','Freeze wallet','freezeWallet()')">${icons.lock} Freeze wallet</button>`}</div></div><div class="card form-card wide spacer-top"><h2>Your devices</h2><div class="device-row"><div class="device-copy"><span class="method-icon">${icons.device}</span><div><strong>Android · Current device</strong><span>Active now</span></div></div><span class="badge success">Current</span></div><div class="device-row"><div class="device-copy"><span class="method-icon">${ico             <input name="email" type="email" required placeholder="Email address" style="display:block;margin-top:10px;width:100%;padding:11px;border:1px solid #dfe7ec;border-radius:8px">
            <input name="phone" placeholder="Phone number" maxlength="40" style="display:none;margin-top:10px;width:100%;padding:11px;border:1px solid #dfe7ec;border-radius:8px">
            <input name="password" type="password" required minlength="8" placeholder="Password" style="display:block;margin-top:10px;width:100%;padding:11px;border:1px solid #dfe7ec;border-radius:8px">
            <input name="confirm_password" type="password" minlength="8" placeholder="Confirm password" style="display:none;margin-top:10px;width:100%;padding:11px;border:1px solid #dfe7ec;border-radius:8px">
            <p id="zed-auth-error" style="min-height:18px;color:#bb4c4c;font-size:12px"></p><button id="zed-auth-submit" type="submit" style="width:100%;padding:12px;border:0;border-radius:8px;background:#0a3150;color:#fff;font-weight:700">Sign in</button>
          </form><div style="display:flex;justify-content:space-between;margin-top:14px;font-size:12px"><button id="zed-auth-forgot" style="background:none;color:#155a80">Forgot password?</button><button id="zed-auth-switch" style="background:none;color:#155a80">Create account</button></div>
        </div></div>`;
      document.body.appendChild(modal);
      const box = document.getElementById('zed-auth'), form = document.getElementById('zed-auth-form'), copy = document.getElementById('zed-auth-copy'), submit = document.getElementById('zed-auth-submit'), names = document.getElementById('zed-name-fields'), phone = form.phone, confirm = form.confirm_password, error = document.getElementById('zed-auth-error');
      let mode = 'signin';
      const open = (next = 'signin') => { mode = next; box.style.display = 'grid'; const signup = mode === 'signup'; names.style.display = signup ? 'flex' : 'none'; phone.style.display = signup ? 'block' : 'none'; confirm.style.display = signup ? 'block' : 'none'; copy.textContent = signup ? 'Create your secure wallet account.' : 'Sign in to access your wallet.'; submit.textContent = signup ? 'Create account' : 'Sign in'; document.getElementById('zed-auth-forgot').style.display = signup ? 'none' : 'inline'; document.getElementById('zed-auth-switch').textContent = signup ? 'I already have an account' : 'Create account'; };
      document.getElementById('zed-auth-close').onclick = () => box.style.display = 'none';
      document.getElementById('zed-auth-switch').onclick = () => open(mode === 'signup' ? 'signin' : 'signup');
      document.getElementById('zed-auth-forgot').onclick = async () => { const email = form.email.value.trim(); if (!email) { error.textContent = 'Enter your email first.'; return; } const { error: e } = await auth.auth.resetPasswordForEmail(email, { redirectTo: `${location.origin}${location.pathname}` }); error.textContent = e ? e.message : 'Check your email for a password reset link.'; };
      form.onsubmit = async (event) => { event.preventDefault(); error.textContent = ''; submit.disabled = true; try { if (mode === 'signup') { if (form.password.value !== form.confirm_password.value) throw new Error('Passwords do not match.'); const { data, error: e } = await auth.auth.signUp({ email: form.email.value.trim(), password: form.password.value, options: { data: { first_name: form.first_name.value.trim(), last_name: form.last_name.value.trim(), phone: form.phone.value.trim() } } }); if (e) throw e; session = data.session; if (!session) error.textContent = 'Check your email to verify your account.'; else { box.style.display = 'none'; await api('/api/me'); render(); } } else { const { data, error: e } = await auth.auth.signInWithPassword({ email: form.email.value.trim(), password: form.password.value }); if (e) throw e; session = data.session; box.style.display = 'none'; await api('/api/me'); render(); } } catch (e) { error.textContent = e.message || 'Unable to complete authentication.'; } finally { submit.disabled = false; } };
      auth.auth.onAuthStateChange((_event, next) => { session = next; if (!next) { document.body.dataset.authenticated = 'false'; if (typeof state !== 'undefined') { state.balanceVisible = false; render(); } } else document.body.dataset.authenticated = 'true'; });
      auth.auth.getSession().then(({ data }) => { session = data.session; if (!session) open('signin'); else api('/api/me').catch(() => open('signin')); });
      window.zedmoneyAuth = { open, api, client: auth, getSession: () => session };
    })();
  </script>
  <script>
    (() => {
      const url = document.querySelector('meta[name="zedmoney:supabase-url"]')?.content;
      const anon = document.querySelector('meta[name="zedmoney:supabase-anon-key"]')?.content;
      const next = `${location.pathname}${location.hash || ''}`;
      const goAuth = () => { sessionStorage.setItem('zedmoney:return-to', next); location.replace(`auth.html?returnTo=${encodeURIComponent(next)}`); };
       if (!url || !anon || !window.supabase) return goAuth();
      const client = window.supabase.createClient(url, anon);
      const api = async (path, session) => { const base=document.querySelector('meta[name="zedmoney:api-base-url"]')?.content || ''; const response=await fetch(`${base}${path}`,{headers:{Authorization:`Bearer ${session.access_token}`}}); const body=await response.json().catch(()=>({})); if(!response.ok||body.success===false) throw new Error(body.error?.message||`Request failed (${response.status})`); return body.data; };
      const liveApi = async (path, options={}) => { const session=(await client.auth.getSession()).data.session; if(!session) throw new Error('Your session has expired. Please sign in again.'); const base=document.querySelector('meta[name="zedmoney:api-base-url"]')?.content||''; const headers={'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`,...(options.headers||{})}; const res=await fetch(`${base}${path}`,{...options,headers,body:options.body===undefined?undefined:JSON.stringify(options.body)}); const body=await res.json().catch(()=>({})); if(!res.ok||body.success===false)throw new Error(body.error?.message||`Request failed (${res.status})`); return body.data; };
      window.liveApi=liveApi;
      const mapTransaction = t => { const incoming=['deposit','refund','adjustment','release'].includes(t.type)||(t.type==='transfer'&&!t.recipient_user_id); const failed=['failed','reversed','cancelled'].includes(t.status); const amount=incoming?Number(t.amount||0):-Number(t.amount||0); return {id:t.reference||t.id,type:failed?'failed':t.status==='pending'||t.status==='processing'?'pending':incoming?'in':'out',title:(t.description||t.type||'Transaction').replace(/\s+/g,' ').trim(),sub:t.provider||t.type||'Transaction',amount,date:formatDate(t.created_at),status:t.status==='successful'?'Completed':t.status==='pending'||t.status==='processing'?'Pending':t.status==='failed'?'Failed':String(t.status||'Completed'),method:t.provider||'ZedMoney',fee:`${t.currency||liveCurrency()} ${Number(t.fee||0).toFixed(2)}`,party:t.recipient_user_id?'Recipient':'',providerMessage:t.metadata?.provider_message||''}; };
       const loadLiveData = async session => { const [me,tx,recipients,requests,links,notifications,analytics]=await Promise.all([api('/api/me',session),api('/api/transactions?limit=100',session),api('/api/recipients',session),api('/api/requests',session),api('/api/payment-links',session),api('/api/notifications',session),api('/api/analytics',session)]); window.zedmoneyProfile={...me,analytics:analytics||{}}; transactions=(tx?.items||[]).map(mapTransaction); state.currency=me?.wallet?.currency||me?.profile?.currency||'ZMW'; state.recipients=(recipients||[]).map(r=>({name:r.label||r.phone||'Recipient',phone:r.phone||'',id:r.recipient_user_id||'',favorite:!!r.favorite,dbId:r.id})); state.requests=(requests||[]).map(r=>({name:r.requester_id===me.user.id?'Request sent':'Money request',amount:Number(r.amount||0),note:r.note||'',status:(r.status||'pending').replace(/^./,x=>x.toUpperCase()),date:formatDate(r.created_at),id:r.id})); state.links=(links||[]).map(l=>({name:l.description||'Payment link',amount:Number(l.amount||0),status:(l.status||'active').replace(/^./,x=>x.toUpperCase()),code:l.code,dbId:l.id,description:l.description||'',expires:l.expires_at?new Date(l.expires_at).toLocaleDateString():''})); window.zedmoneyNotifications=notifications||[]; };
        let notificationPollBusy = false, balancePollBusy = false;
        const pollNotifications = async () => { if (notificationPollBusy || document.hidden) return; notificationPollBusy = true; try { const session=(await client.auth.getSession()).data.session; if (!session) return; const next=await api('/api/notifications',session); const previous=window.zedmoneyNotifications||[]; const oldIds=new Set(previous.map(n=>n.id)); const fresh=(next||[]).filter(n=>!oldIds.has(n.id)); window.zedmoneyNotifications=next||[]; if (fresh.length) { state.notificationRead=false; const dot=document.querySelector('.notification-dot'); if(dot)dot.textContent=String(Math.min(9,Math.max(1,fresh.length))); } } catch(e) { console.debug('Notification polling failed:',e.message); } finally { notificationPollBusy=false; } };
        const pollWalletBalance = async () => { if (balancePollBusy || document.hidden) return; balancePollBusy=true; try { const session=(await client.auth.getSession()).data.session; if(!session)return; const next=await api('/api/wallet/balance',session); if(window.zedmoneyProfile?.wallet&&next)window.zedmoneyProfile.wallet={...window.zedmoneyProfile.wallet,...next}; } catch(e) { console.debug('Balance polling failed:',e.message); } finally { balancePollBusy=false; } };
       window.refreshWalletData=async()=>{try{const session=(await client.auth.getSession()).data.session;if(!session)return goAuth();await loadLiveData(session);render();}catch(e){console.error(e);showToast('Unable to refresh wallet data');}};
       setInterval(pollNotifications,30000);
        setInterval(pollWalletBalance,30000);
      window.createLiveRequest=async()=>{showToast('Select a saved recipient before creating a request.');};
      const clearPrivateState = () => { try { sessionStorage.removeItem('zedmoney:private-state'); localStorage.removeItem('zedmoney:session-start'); } catch (_) {} state.balanceVisible=false; state.selectedTx=null; window.zedmoneyProfile=null; transactions=[]; state.recipients=[]; state.requests=[]; state.links=[]; window.zedmoneyNotifications=[]; };
      const check = async () => {
        const { data } = await client.auth.getSession();
        if (!data.session) return goAuth();
        const started = Number(localStorage.getItem('zedmoney:session-start') || 0);
        if (started && Date.now() - started >= 24 * 60 * 60 * 1000) { await client.auth.signOut(); return goAuth(); }
        if (!started) localStorage.setItem('zedmoney:session-start', String(Date.now()));
        const apiBaseUrl = document.querySelector('meta[name="zedmoney:api-base-url"]')?.content || '';
        try { await loadLiveData(data.session); }
        catch (e) { console.error('Authenticated wallet data load failed:',e); await client.auth.signOut(); return goAuth(); }
        document.body.dataset.authReady = 'true';
        document.body.dataset.authenticated = 'true';
         render();
         maybeShowWelcome();
        document.getElementById('loading-cover')?.classList.add('hidden');
        document.getElementById('loading-cover')?.classList.add('hidden');
      };
      client.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT' || (!session && event !== 'INITIAL_SESSION')) { clearPrivateState(); goAuth(); }
      });
      window.zedmoneyAuth = { client, signOut: async () => { clearPrivateState(); await client.auth.signOut(); goAuth(); } };
      check().catch(goAuth);
    })();
  </script>
